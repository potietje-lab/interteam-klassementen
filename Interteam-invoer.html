<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f1f3f5;
    color: #222;
}

.container {
    max-width: 950px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    margin: 0 0 25px 0;
    font-size: 28px;
}

h2 {
    margin: 25px 0 10px 0;
    font-size: 20px;
}


/* SPEELDATUM */

.datum-box {
    background: #f7f7f7;
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 10px;
}

.datum-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

select {
    width: 100%;
    padding: 12px;
    font-size: 17px;
    border: 1px solid #bbb;
    border-radius: 7px;
    background: white;
}


/* INFO */

.info-box {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #eef6ff;
    border: 1px solid #c8def5;
    color: #174ea6;
    font-size: 14px;
    text-align: center;
}


/* STATUS */

.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.status.info {
    background: #e8f0fe;
    color: #174ea6;
}

.status.success {
    background: #e6f4ea;
    color: #137333;
}

.status.warning {
    background: #fff4ce;
    color: #8a5a00;
}

.status.error {
    background: #fce8e6;
    color: #b00020;
}


/* WEDSTRIJD */

.match {
    margin-top: 18px;
    border: 1px solid #d7d7d7;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
}

.match-header {
    display: grid;
    grid-template-columns: 1fr 80px 80px;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    background: #f0f0f0;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
}

.match-title {
    font-size: 15px;
}

.match-title .vs {
    font-weight: normal;
    color: #666;
    padding: 0 5px;
}

.team-row {
    display: grid;
    grid-template-columns: 1fr 80px 80px;
    gap: 10px;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
}

.team-row:last-child {
    border-bottom: none;
}

.team-name {
    font-weight: bold;
}

.team-name.home::before {
    content: "🏠 ";
}

.team-name.away::before {
    content: "   ";
}

input[type="number"] {
    width: 100%;
    padding: 9px 5px;
    font-size: 15px;
    border: 1px solid #bbb;
    border-radius: 6px;
    text-align: center;
}

input[type="number"]:focus {
    outline: 2px solid #999;
}

input.invalid-input {
    border: 2px solid #d93025;
    background: #fff0f0;
}


/* RNB */

.rnb-row {
    background: #fffbe0;
}

input.auto-kegels {
    background: #eeeeee;
    border-color: #aaa;
    font-weight: bold;
    color: #333;
    cursor: not-allowed;
}

.rnb-label {
    display: block;
    font-size: 11px;
    color: #8a5a00;
    font-weight: normal;
    margin-top: 3px;
}


/* OPSLAAN */

button {
    width: 100%;
    border: none;
    border-radius: 9px;
    padding: 15px;
    margin-top: 20px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.save-button {
    background: #222;
    color: white;
}

.save-button:hover {
    background: #444;
}

.save-button:disabled {
    background: #999;
    cursor: not-allowed;
}


/* PUNTENTOTAAL */

.total-box {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    background: #f5f5f5;
    border: 1px solid #ddd;
}

.total-ok {
    background: #e6f4ea;
    color: #137333;
    border-color: #8bc995;
}

.total-error {
    background: #fce8e6;
    color: #b00020;
    border-color: #e57373;
}


/* MOBIEL */

@media (max-width: 600px) {

    body {
        padding: 7px;
    }

    .container {
        padding: 12px;
        border-radius: 10px;
    }

    h1 {

    }

    .match-header,

        padding: 8px 6px;
    }

    .team-name {

    }

    .match-title {
        font-size: 13px;
    }

    input[type="number"] {
        padding: 8px 3px;
        font-size: 13px;
    }

}

</style>

// =====================================================
// NAAM NORMALISEREN
// =====================================================

function normaliseerNaam(naam) {

    return String(naam || "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();

}


// =====================================================
// IS RNB?
// =====================================================

function isRNB(naam) {

    return normaliseerNaam(naam) ===
           normaliseerNaam(RNB);

}


// =====================================================
// STATUS

    tekst,

) {

    element.className =

}


// =====================================================
// RNB KEGELS BEREKENEN
// =====================================================

async function berekenRNBKegels(
    datum
) {

    const {
        data,
        error
    } = await supabaseClient

        .from("bowling_scores")

        .select(
            "speeldatum, speler, game1, game2, game3"
        )

        .eq(
            "speeldatum",
            datum
        );


    if (error) {

        console.error(
            error
        );

        return {
            success: false,
            kegels: null,
            spelers: 0,
            games: 0
        };

    }


    const scores =
        data || [];


    let totaal =
        0;

    let games =
        0;


    scores.forEach(
        speler => {

            [
                speler.game1,
                speler.game2,
                speler.game3
            ].forEach(
                game => {

                    if (
                        game !== null &&
                        game !== undefined &&
                        game !== ""
                    ) {

                        const waarde =
                            Number(game);

                        if (
                            Number.isFinite(
                                waarde
                            )
                        ) {

                            totaal +=
                                waarde;

                            games++;

                        }

                    }

                }
            );

        }
    );


    const volledig =
        scores.length ===
        AANTAL_RNB_SPELERS &&
        games ===
        TOTAAL_RNB_GAMES;


    return {

        success:
            volledig,

        kegels:
            volledig
                ? totaal
                : null,

        spelers:
            scores.length,

        games:
            games

    };

}


// =====================================================
// WEDSTRIJDEN TONEN
// =====================================================

function toonWedstrijden(
    datum,
    opgeslagenScores = []
) {

    const container =
        document.getElementById(
            "wedstrijden"
        );


    container.innerHTML =
        "";


    const wedstrijden =
        WEDSTRIJDEN[datum] || [];


    wedstrijden.forEach(
        (wedstrijd, wedstrijdIndex) => {

            const thuis =
                wedstrijd[0];

            const uit =
                wedstrijd[1];


            const thuisScore =
                vindScore(
                    opgeslagenScores,
                    thuis
                );


            const uitScore =
                vindScore(
                    opgeslagenScores,
                    uit
                );


            const match =
                document.createElement(
                    "div"
                );


            match.className =
                "match";


            match.innerHTML = `

                <div class="match-header">

                    <div class="match-title">

                        ${wedstrijdIndex + 1}.
                        ${escapeHtml(thuis)}

                        <span class="vs">
                            tegen
                        </span>

                        ${escapeHtml(uit)}

                    </div>

                    <div>Kegels</div>

                    <div>Punten</div>

                </div>


                ${maakTeamRij(
                    thuis,
                    thuisScore,
                    "home",
                    wedstrijdIndex,
                    "thuis"
                )}


                ${maakTeamRij(
                    uit,
                    uitScore,
                    "away",
                    wedstrijdIndex,
                    "uit"
                )}

            `;


            container.appendChild(
                match
            );

        }
    );


    updateTotaal();

}


// =====================================================
// TEAM RIJ MAKEN
// =====================================================

function maakTeamRij(
    ploeg,
    score,
    positie,
    wedstrijdIndex,
    kant
) {

    const rnb =
        isRNB(
            ploeg
        );


    const id =
        maakId(
            wedstrijdIndex,
            kant
        );


    const kegelsWaarde =
        rnb
            ? ""
            : (
                score &&
                score.kegels !== null &&
                score.kegels !== undefined
                    ? score.kegels
                    : ""
            );


    const puntenWaarde =
        score &&
        score.punten !== null &&
        score.punten !== undefined
            ? score.punten
            : "";


    return `

        <div
            class="team-row ${
                rnb ? "rnb-row" : ""
            }">

            <div class="team-name ${positie}">

                ${escapeHtml(ploeg)}

                ${
                    rnb
                        ? `
                            <span class="rnb-label">
                                Kegels automatisch uit spelersscores
                            </span>
                          `
                        : ""
                }

            </div>


            <input
                type="number"
                min="0"
                id="kegels-${id}"
                value="${kegelsWaarde}"
                placeholder="${
                    rnb
                        ? "Auto"
                        : "Kegels"
                }"
                class="${
                    rnb
                        ? "auto-kegels"
                        : ""
                }"
                ${
                    rnb
                        ? "readonly"
                        : ""
                }
                ${
                    rnb
                        ? ""
                        : `oninput="updateTotaal()"`
                }
            >


            <input
                type="number"
                min="0"
                max="31"
                id="punten-${id}"
                value="${puntenWaarde}"
                placeholder="0-31"
                oninput="updateTotaal()"
            >

        </div>

    `;

}


// =====================================================
// ID MAKEN
// =====================================================

function maakId(
    wedstrijdIndex,
    kant
) {

    return (
        wedstrijdIndex +
        "-" +
        kant
    );

}


// =====================================================
// SCORE VINDEN
// =====================================================

function vindScore(
    scores,
    ploeg
) {

    const naam =
        normaliseerNaam(
            ploeg
        );


    return (
        scores || []
    ).find(
        score =>
            normaliseerNaam(
                score.ploeg
            ) === naam
    ) || null;

}


// =====================================================
// SCORES LADEN
// =====================================================

async function laadScores() {

    const datum =
        document.getElementById(
            "speeldatum"
        ).value;


    statusMelding(
        "Scores worden geladen...",
        "info"
    );


    const {
        data,
        error
    } = await supabaseClient

        .from("interteam_scores")

        .select(
            "speeldatum, ploeg, kegels, punten"
        )

        .eq(
            "speeldatum",
            datum
        );


    if (error) {

        console.error(
            error
        );


        statusMelding(
            "❌ Fout bij laden van scores.",
            "error"
        );


        return;

    }


    // Eerst kalender tonen
    toonWedstrijden(
        datum,
        data || []
    );


    // Daarna RNB automatisch berekenen
    const rnb =
        await berekenRNBKegels(
            datum
        );


    if (
        rnb.success
    ) {

        zetRNBKegels(
            rnb.kegels
        );


        if (
            data &&
            data.length > 0
        ) {

            statusMelding(
                datumNaarTekst(datum) +
                ": scores geladen. RNB-kegels automatisch berekend.",
                "success"
            );

        }
        else {

            statusMelding(
                datumNaarTekst(datum) +
                ": nieuwe invoer. RNB-kegels automatisch beschikbaar.",
                "info"
            );

        }

    }

    else {

        statusMelding(
            datumNaarTekst(datum) +
            ": RNB heeft " +
            rnb.spelers +
            "/5 spelers en " +
            rnb.games +
            "/15 games ingevuld.",
            "warning"
        );

    }


    updateTotaal();

}


// =====================================================
// RNB KEGELS IN ALLE RNB-VELDEN ZETTEN
// =====================================================

function zetRNBKegels(
    kegels
) {

    const velden =
        document.querySelectorAll(
            ".auto-kegels"
        );


    velden.forEach(
        veld => {

            veld.value =
                kegels;

        }
    );

}


// =====================================================
// TOTAAL PUNTEN
// =====================================================

function updateTotaal() {

    let totaal =
        0;


    document
        .querySelectorAll(
            'input[id^="punten-"]'
        )
        .forEach(
            veld => {

                if (
                    veld.value !== ""
                ) {

                    const waarde =
                        Number(
                            veld.value
                        );


                    if (
                        Number.isFinite(
                            waarde
                        )
                    ) {

                        totaal +=
                            waarde;

                    }

                }

            }
        );


    const box =
        document.getElementById(
            "totaalBox"
        );


    box.innerText =
        "Totaal punten: " +
        totaal +
        " / " +
        TOTAAL_PUNTEN;


    box.classList.remove(
        "total-ok",
        "total-error"
    );


    if (
        totaal ===
        TOTAAL_PUNTEN
    ) {

        box.classList.add(
            "total-ok"
        );

    }

    else if (
        totaal >
        TOTAAL_PUNTEN
    ) {

        box.classList.add(
            "total-error"
        );

    }

}


// =====================================================
// OPSLAAN
// =====================================================

async function opslaan() {

    const datum =
        document.getElementById(
            "speeldatum"
        ).value;


    // -------------------------------------------------
    // RNB opnieuw rechtstreeks uit bowling_scores
    // berekenen
    // -------------------------------------------------

    const rnb =
        await berekenRNBKegels(
            datum
        );


    if (
        !rnb.success
    ) {

        alert(
            "❌ RNB kan niet worden opgeslagen.\n\n" +
            "Voor " +
            datumNaarTekst(datum) +
            " zijn " +
            rnb.spelers +
            " van de 5 spelers gevonden en " +
            rnb.games +
            " van de 15 games ingevuld.\n\n" +
            "Alle 5 spelers en alle 3 games per speler moeten ingevuld zijn."
        );


        return;

    }


    let records =
        [];


    let fouten =
        [];


    let totaal =
        0;


    const wedstrijden =
        WEDSTRIJDEN[datum] || [];


    // -------------------------------------------------
    // Alle 6 wedstrijden
    // -------------------------------------------------

    wedstrijden.forEach(
        (wedstrijd, wedstrijdIndex) => {

            const teams = [
                {
                    ploeg:
                        wedstrijd[0],

                    kant:
                        "thuis"
                },
                {
                    ploeg:
                        wedstrijd[1],

                    kant:
                        "uit"
                }
            ];


            teams.forEach(
                team => {

                    const id =
                        maakId(
                            wedstrijdIndex,
                            team.kant
                        );


                    const puntenElement =
                        document.getElementById(
                            "punten-" +
                            id
                        );


                    if (
                        !puntenElement
                    ) {

                        fouten.push(
                            team.ploeg +
                            ": puntenveld ontbreekt."
                        );

                        return;

                    }


                    const punten =
                        puntenElement.value;


                    if (
                        punten === ""
                    ) {

                        fouten.push(
                            team.ploeg +
                            ": punten niet ingevuld."
                        );

                        return;

                    }


                    const puntenGetal =
                        Number(
                            punten
                        );


                    if (
                        !Number.isFinite(
                            puntenGetal
                        ) ||
                        puntenGetal < 0 ||
                        puntenGetal > MAX_PUNTEN
                    ) {

                        fouten.push(
                            team.ploeg +
                            ": maximaal 31 punten."
                        );

                        return;

                    }


                    let kegelsGetal;


                    // ---------------------------------
                    // RNB
                    // ---------------------------------

                    if (
                        isRNB(
                            team.ploeg
                        )
                    ) {

                        kegelsGetal =
                            rnb.kegels;

                    }

                    // ---------------------------------
                    // Andere ploeg
                    // ---------------------------------

                    else {

                        const kegelsElement =
                            document.getElementById(
                                "kegels-" +
                                id
                            );


                        if (
                            !kegelsElement ||
                            kegelsElement.value === ""
                        ) {

                            fouten.push(
                                team.ploeg +
                                ": kegels niet ingevuld."
                            );

                            return;

                        }


                        kegelsGetal =
                            Number(
                                kegelsElement.value
                            );


                        if (
                            !Number.isFinite(
                                kegelsGetal
                            ) ||
                            kegelsGetal < 0
                        ) {

                            fouten.push(
                                team.ploeg +
                                ": ongeldig aantal kegels."
                            );

                            return;

                        }

                    }


                    totaal +=
                        puntenGetal;


                    records.push({

                        speeldatum:
                            datum,

                        ploeg:
                            team.ploeg,

                        kegels:
                            kegelsGetal,

                        punten:
                            puntenGetal

                    });

                }
            );

        }
    );


    // -------------------------------------------------
    // Fouten
    // -------------------------------------------------

    if (
        fouten.length > 0
    ) {

        alert(
            "❌ Controleer de invoer:\n\n" +
            fouten.join(
                "\n"
            )
        );


        return;

    }


    // -------------------------------------------------
    // EXACT 186 PUNTEN
    // -------------------------------------------------

    if (
        totaal !==
        TOTAAL_PUNTEN
    ) {

        alert(
            "⚠️ Het totaal van de punten is " +
            totaal +
            ".\n\n" +
            "Het totaal moet exact 186 zijn."
        );


        return;

    }


    // -------------------------------------------------
    // OPSLAAN
    // -------------------------------------------------

    const button =
        document.getElementById(
            "saveButton"
        );


    button.disabled =
        true;


    button.innerText =
        "⏳ Opslaan...";


    const {
        error
    } = await supabaseClient

        .from(
            "interteam_scores"
        )

        .upsert(
            records,
            {
                onConflict:
                    "speeldatum,ploeg"
            }
        );


    button.disabled =
        false;


    button.innerText =
        "💾 ALLE SCORES OPSLAAN";


    if (error) {

        console.error(
            error
        );


        statusMelding(
            "❌ Fout bij opslaan: " +
            error.message,
            "error"
        );


        return;

    }


    statusMelding(
        "✅ Scores opgeslagen voor " +
        datumNaarTekst(datum) +
        ". RNB-kegels: " +
        rnb.kegels +
        ". Totaal punten: 186.",
        "success"
    );


    alert(
        "✅ Scores succesvol opgeslagen!\n\n" +
        "Speeldatum: " +
        datumNaarTekst(datum) +
        "\n" +
        "RNB kegels: " +
        rnb.kegels +
        "\n" +
        "Totaal punten: 186"
    );


    await laadScores();

}


// =====================================================
// DATUM
// =====================================================

function datumNaarTekst(
    datum
) {

    const delen =
        datum.split("-");


    return (
        delen[2] +
        "/" +
        delen[1] +
        "/" +
        delen[0]
    );

}


// =====================================================
// HTML VEILIG MAKEN
// =====================================================

function escapeHtml(
    tekst
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        tekst;


    return div.innerHTML;

}
