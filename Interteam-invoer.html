
<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Rollbowl - Interteam Invoer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f1f3f5;
    color: #222;
}

.container {
    max-width: 950px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    margin: 0 0 25px 0;
    font-size: 28px;
}

h2 {
    margin: 25px 0 10px 0;
    font-size: 20px;
}


/* SPEELDATUM */

.datum-box {
    background: #f7f7f7;
    border: 1px solid #ddd;
    padding: 15px;
    border-radius: 10px;
}

.datum-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

select {
    width: 100%;
    padding: 12px;
    font-size: 17px;
    border: 1px solid #bbb;
    border-radius: 7px;
    background: white;
}


/* STATUS */

.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.status.info {
    background: #e8f0fe;
    color: #174ea6;
}

.status.success {
    background: #e6f4ea;
    color: #137333;
}

.status.warning {
    background: #fff4ce;
    color: #8a5a00;
}

.status.error {
    background: #fce8e6;
    color: #b00020;
}


/* TABEL */

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

.header,
.team {
    display: grid;

    grid-template-columns:
        minmax(280px, 1fr)
        150px
        130px
        100px;

    gap: 10px;
    align-items: center;
}

.header {
    margin-top: 15px;
    padding: 10px 12px;
    font-weight: bold;
    border-bottom: 2px solid #333;
}

.team {
    padding: 10px 12px;
    margin-top: 7px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
}

.team.saved {
    background: #edf8ef;
    border-color: #8bc995;
}

.team.invalid {
    background: #ffeaea;
    border-color: #d93025;
}

.team-name {
    font-weight: bold;
}

.team-number {
    display: inline-block;
    min-width: 28px;
    color: #666;
}

input[type="number"] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #bbb;
    border-radius: 6px;
    text-align: center;
}

input[type="number"]:focus {
    outline: 2px solid #999;
}

input.invalid-input {
    border: 2px solid #d93025;
    background: #fff0f0;
}


/* RIJ STATUS */

.row-status {
    text-align: center;
    font-size: 14px;
    font-weight: bold;
}

.row-status.saved {
    color: #137333;
}

.row-status.empty {
    color: #777;
}

.row-status.invalid {
    color: #d93025;
}


/* OPSLAAN */

button {
    width: 100%;
    border: none;
    border-radius: 9px;
    padding: 15px;
    margin-top: 20px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.save-button {
    background: #222;
    color: white;
}

.save-button:hover {
    background: #444;
}

.save-button:disabled {
    background: #999;
    cursor: not-allowed;
}


/* MOBIEL */

@media (max-width: 700px) {

    body {
        padding: 7px;
    }

    .container {
        padding: 12px;
        border-radius: 10px;
    }

    h1 {
        font-size: 23px;
    }

    .header,
    .team {
        grid-template-columns:
            minmax(150px, 1fr)
            90px
            75px
            65px;

        gap: 5px;
    }

    .header {
        font-size: 13px;
        padding: 8px 5px;
    }

    .team {
        padding: 8px 5px;
    }

    .team-name {
        font-size: 13px;
    }

    input[type="number"] {
        padding: 8px 4px;
        font-size: 14px;
    }

    .row-status {
        font-size: 11px;
    }

}


@media (max-width: 450px) {

    .header,
    .team {
        grid-template-columns:
            minmax(125px, 1fr)
            75px
            65px
            55px;
    }

    .team-name {
        font-size: 12px;
    }

    input[type="number"] {
        font-size: 13px;
    }

}

</style>

</head>


<body>


<div class="container">


<h1>🎳 Interteam Scores</h1>


<!-- SPEELDATUM -->

<h2>Speeldatum</h2>


<div class="datum-box">

<label for="speeldatum">
    Kies de speeldatum:
</label>


<select
    id="speeldatum"
    onchange="laadScores()">

    <option value="2026-09-04">04/09/2026</option>
    <option value="2026-09-11">11/09/2026</option>
    <option value="2026-09-18">18/09/2026</option>
    <option value="2026-09-25">25/09/2026</option>
    <option value="2026-10-02">02/10/2026</option>
    <option value="2026-10-09">09/10/2026</option>
    <option value="2026-10-16">16/10/2026</option>
    <option value="2026-11-20">20/11/2026</option>
    <option value="2026-11-27">27/11/2026</option>
    <option value="2026-12-04">04/12/2026</option>
    <option value="2026-12-11">11/12/2026</option>
    <option value="2027-01-15">15/01/2027</option>
    <option value="2027-01-22">22/01/2027</option>
    <option value="2027-01-29">29/01/2027</option>
    <option value="2027-02-19">19/02/2027</option>
    <option value="2027-02-26">26/02/2027</option>
    <option value="2027-03-19">19/03/2027</option>
    <option value="2027-03-26">26/03/2027</option>
    <option value="2027-04-16">16/04/2027</option>
    <option value="2027-04-23">23/04/2027</option>
    <option value="2027-05-07">07/05/2027</option>
    <option value="2027-05-14">14/05/2027</option>

</select>

</div>


<!-- STATUS -->

<div
    id="status"
    class="status info">

    Ploegen worden geladen...

</div>


<h2>Scores per ploeg</h2>


<!-- TABEL -->

<div class="table-wrapper">


<div class="header">

    <div>Ploeg</div>
    <div>Kegels</div>
    <div>Punten</div>
    <div>Status</div>

</div>


<div id="ploegen"></div>


</div>


<!-- OPSLAAN -->

<button
    id="saveButton"
    class="save-button"
    onclick="opslaan()">

    💾 ALLE SCORES OPSLAAN

</button>


</div>



<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://wnsvbtskynkewxggmjem.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_9d-2CTihH00Q9gUzLYI6lA_13GHTmCx";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// =====================================================
// INSTELLINGEN
// =====================================================

const MAX_PUNTEN = 31;

const TOTAAL_PUNTEN = 186;


// =====================================================
// PLOEGEN
// =====================================================

let ploegen = [];


// =====================================================
// NAAM NORMALISEREN
// =====================================================

function normaliseerNaam(naam) {

    return String(naam || "")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();

}


// =====================================================
// STATUSMELDING
// =====================================================

function statusMelding(
    tekst,
    type = "info"
) {

    const element =
        document.getElementById(
            "status"
        );


    if (!element) {
        return;
    }


    element.innerText =
        tekst;


    element.className =
        "status " + type;

}


// =====================================================
// PLOEGEN LADEN
// =====================================================

async function laadPloegen() {

    statusMelding(
        "Ploegen worden geladen...",
        "info"
    );


    const { data, error } =
        await supabaseClient

        .from(
            "Interteams 2026-2027 afdeling 3A"
        )

        .select(
            "id, ploeg, actief"
        )

        .eq(
            "actief",
            true
        )

        .order(
            "id",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Fout bij laden ploegen:",
            error
        );


        statusMelding(
            "❌ Fout bij laden van de ploegen.",
            "error"
        );


        return;

    }


    ploegen =
        data || [];


    if (
        ploegen.length === 0
    ) {

        statusMelding(
            "⚠️ Geen actieve ploegen gevonden.",
            "warning"
        );


        return;

    }


    toonPloegen();


    await laadScores();

}


// =====================================================
// PLOEGEN TONEN
// =====================================================

function toonPloegen() {

    const container =
        document.getElementById(
            "ploegen"
        );


    if (!container) {
        return;
    }


    container.innerHTML = "";


    ploegen.forEach(
        (ploeg, index) => {

            const rij =
                document.createElement(
                    "div"
                );


            rij.className =
                "team";


            rij.id =
                "team-" +
                ploeg.id;


            rij.innerHTML = `

                <div class="team-name">

                    <span class="team-number">
                        ${index + 1}.
                    </span>

                    ${escapeHtml(
                        ploeg.ploeg
                    )}

                </div>


                <input
                    type="number"
                    min="0"
                    id="kegels-${ploeg.id}"
                    placeholder="Kegels"
                    oninput="controleerRij(${ploeg.id})"
                >


                <input
                    type="number"
                    min="0"
                    max="31"
                    id="punten-${ploeg.id}"
                    placeholder="0 - 31"
                    oninput="controleerRij(${ploeg.id})"
                >


                <div
                    class="row-status empty"
                    id="status-${ploeg.id}">

                    Niet ingevuld

                </div>

            `;


            container.appendChild(
                rij
            );

        }
    );

}


// =====================================================
// SCORES LADEN
// =====================================================

async function laadScores() {

    if (
        ploegen.length === 0
    ) {
        return;
    }


    const datum =
        document.getElementById(
            "speeldatum"
        ).value;


    statusMelding(
        "Scores worden geladen...",
        "info"
    );


    // Eerst alle velden leegmaken

    ploegen.forEach(
        ploeg => {

            const kegels =
                document.getElementById(
                    "kegels-" +
                    ploeg.id
                );


            const punten =
                document.getElementById(
                    "punten-" +
                    ploeg.id
                );


            const rij =
                document.getElementById(
                    "team-" +
                    ploeg.id
                );


            const status =
                document.getElementById(
                    "status-" +
                    ploeg.id
                );


            if (kegels) {
                kegels.value = "";
            }


            if (punten) {
                punten.value = "";
            }


            if (rij) {

                rij.classList.remove(
                    "saved",
                    "invalid"
                );

            }


            if (status) {

                status.innerText =
                    "Niet ingevuld";

                status.className =
                    "row-status empty";

            }

        }
    );


    // Scores ophalen

    const { data, error } =
        await supabaseClient

        .from(
            "interteam_scores"
        )

        .select(
            "speeldatum, ploeg, kegels, punten"
        )

        .eq(
            "speeldatum",
            datum
        );


    if (error) {

        console.error(
            "Fout bij ophalen scores:",
            error
        );


        statusMelding(
            "❌ Fout bij laden van de scores.",
            "error"
        );


        return;

    }


    console.log(
        "Scores uit Supabase:",
        data
    );


    // Geen gegevens

    if (
        !data ||
        data.length === 0
    ) {

        statusMelding(
            datumNaarTekst(datum) +
            ": nog geen scores ingevoerd.",
            "warning"
        );


        return;

    }


    // Scores invullen

    data.forEach(
        score => {

            const opgeslagenNaam =
                normaliseerNaam(
                    score.ploeg
                );


            const ploeg =
                ploegen.find(
                    p =>
                        normaliseerNaam(
                            p.ploeg
                        ) ===
                        opgeslagenNaam
                );


            if (!ploeg) {

                console.warn(
                    "Ploeg niet gevonden:",
                    score.ploeg
                );


                return;

            }


            const kegels =
                document.getElementById(
                    "kegels-" +
                    ploeg.id
                );


            const punten =
                document.getElementById(
                    "punten-" +
                    ploeg.id
                );


            if (kegels) {

                kegels.value =
                    score.kegels ?? "";

            }


            if (punten) {

                punten.value =
                    score.punten ?? "";

            }


            const rij =
                document.getElementById(
                    "team-" +
                    ploeg.id
                );


            const status =
                document.getElementById(
                    "status-" +
                    ploeg.id
                );


            if (rij) {

                rij.classList.add(
                    "saved"
                );

            }


            if (status) {

                status.innerText =
                    "✓ Opgeslagen";

                status.className =
                    "row-status saved";

            }

        }
    );


    statusMelding(
        datumNaarTekst(datum) +
        ": opgeslagen scores geladen.",
        "success"
    );

}


// =====================================================
// RIJ CONTROLEREN
// =====================================================

function controleerRij(
    id
) {

    const kegels =
        document.getElementById(
            "kegels-" +
            id
        );


    const punten =
        document.getElementById(
            "punten-" +
            id
        );


    const rij =
        document.getElementById(
            "team-" +
            id
        );


    const status =
        document.getElementById(
            "status-" +
            id
        );


    if (
        !kegels ||
        !punten ||
        !rij ||
        !status
    ) {
        return;
    }


    // Maximaal 31 punten

    if (
        punten.value !== "" &&
        Number(punten.value) >
        MAX_PUNTEN
    ) {

        punten.classList.add(
            "invalid-input"
        );


        rij.classList.add(
            "invalid"
        );


        rij.classList.remove(
            "saved"
        );


        status.innerText =
            "❌ Max. 31";


        status.className =
            "row-status invalid";


        return;

    }


    punten.classList.remove(
        "invalid-input"
    );


    rij.classList.remove(
        "invalid"
    );


    if (
        kegels.value !== "" &&
        punten.value !== ""
    ) {

        rij.classList.add(
            "saved"
        );


        status.innerText =
            "✓ Klaar";


        status.className =
            "row-status saved";

    }

    else if (
        kegels.value !== "" ||
        punten.value !== ""
    ) {

        rij.classList.remove(
            "saved"
        );


        status.innerText =
            "⚠ Onvolledig";


        status.className =
            "row-status empty";

    }

    else {

        rij.classList.remove(
            "saved"
        );


        status.innerText =
            "Niet ingevuld";


        status.className =
            "row-status empty";

    }

}


// =====================================================
// OPSLAAN
// =====================================================

async function opslaan() {

    const datum =
        document.getElementById(
            "speeldatum"
        ).value;


    let records = [];

    let fouten = [];

    let totaal = 0;


    // Alle ploegen controleren

    ploegen.forEach(
        ploeg => {

            const kegels =
                document.getElementById(
                    "kegels-" +
                    ploeg.id
                ).value;


            const punten =
                document.getElementById(
                    "punten-" +
                    ploeg.id
                ).value;


            if (
                kegels === "" ||
                punten === ""
            ) {

                fouten.push(
                    ploeg.ploeg +
                    ": niet volledig ingevuld."
                );


                return;

            }


            const kegelsGetal =
                Number(kegels);


            const puntenGetal =
                Number(punten);


            if (
                !Number.isFinite(
                    kegelsGetal
                ) ||
                kegelsGetal < 0
            ) {

                fouten.push(
                    ploeg.ploeg +
                    ": ongeldig aantal kegels."
                );


                return;

            }


            if (
                !Number.isFinite(
                    puntenGetal
                ) ||
                puntenGetal < 0 ||
                puntenGetal > MAX_PUNTEN
            ) {

                fouten.push(
                    ploeg.ploeg +
                    ": maximaal 31 punten."
                );


                return;

            }


            totaal +=
                puntenGetal;


            records.push({

                speeldatum:
                    datum,

                ploeg:
                    ploeg.ploeg,

                kegels:
                    kegelsGetal,

                punten:
                    puntenGetal

            });

        }
    );


    // Invoerfouten

    if (
        fouten.length > 0
    ) {

        alert(
            "❌ Controleer de invoer:\n\n" +
            fouten.join("\n")
        );


        return;

    }


    // Totaal moet exact 186 zijn

    if (
        totaal !==
        TOTAAL_PUNTEN
    ) {

        if (
            totaal <
            TOTAAL_PUNTEN
        ) {

            alert(
                "⚠️ Het totaal van de punten is " +
                totaal +
                ".\n\n" +
                "Er zijn nog " +
                (
                    TOTAAL_PUNTEN -
                    totaal
                ) +
                " punten nodig.\n\n" +
                "Het totaal moet exact 186 zijn."
            );

        }

        else {

            alert(
                "❌ Het totaal van de punten is " +
                totaal +
                ".\n\n" +
                "Er zijn " +
                (
                    totaal -
                    TOTAAL_PUNTEN
                ) +
                " punten te veel.\n\n" +
                "Het totaal moet exact 186 zijn."
            );

        }


        return;

    }


    // Opslaan

    const button =
        document.getElementById(
            "saveButton"
        );


    button.disabled =
        true;


    button.innerText =
        "⏳ Opslaan...";


    const { error } =
        await supabaseClient

        .from(
            "interteam_scores"
        )

        .upsert(
            records,
            {
                onConflict:
                    "speeldatum,ploeg"
            }
        );


    button.disabled =
        false;


    button.innerText =
        "💾 ALLE SCORES OPSLAAN";


    if (error) {

        console.error(
            "Opslaan fout:",
            error
        );


        statusMelding(
            "❌ Fout bij opslaan: " +
            error.message,
            "error"
        );


        return;

    }


    statusMelding(
        "✅ Scores opgeslagen voor " +
        datumNaarTekst(datum) +
        ".",
        "success"
    );


    // Opnieuw laden uit Supabase

    await laadScores();

}


// =====================================================
// DATUM OMZETTEN
// =====================================================

function datumNaarTekst(
    datum
) {

    const delen =
        datum.split("-");


    return (
        delen[2] +
        "/" +
        delen[1] +
        "/" +
        delen[0]
    );

}


// =====================================================
// HTML VEILIG MAKEN
// =====================================================

function escapeHtml(
    tekst
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        tekst;


    return div.innerHTML;

}


// =====================================================
// START
// =====================================================

laadPloegen();

</script>


</body>

</html>
