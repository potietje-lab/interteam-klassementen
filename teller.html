<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bezoekersteller</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #121212;
        color: white;
        font-family: Arial, sans-serif;
    }

    .teller {
        text-align: center;
        padding: 35px 50px;
        background: #1e1e1e;
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        min-width: 280px;
    }

    .titel {
        font-size: 22px;
        margin-bottom: 20px;
    }

    .icoon {
        font-size: 42px;
        margin-bottom: 10px;
    }

    #aantal {
        font-size: 58px;
        font-weight: bold;
        line-height: 1;
        margin: 10px 0;
    }

    .tekst {
        font-size: 15px;
        color: #aaa;
        margin-top: 15px;
    }

    .fout {
        color: #ff6b6b;
        font-size: 14px;
        margin-top: 15px;
    }
</style>
</head>

<body>

<div class="teller">

    <div class="icoon">🎳</div>

    <div class="titel">
        Bezoekers
    </div>

    <div id="aantal">
        ...
    </div>

    <div class="tekst">
        Aantal bezoeken
    </div>

    <div id="fout" class="fout"></div>

</div>

<script>

const SUPABASE_URL =
    "https://wnsvbtskynkewxggmjem.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_9d-2CTihH00Q9gUzLYI6lA_13GHTmCx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function verhoogTeller() {

    const { data, error } =
        await supabaseClient.rpc("verhoog_teller");

    if (error) {

        console.error("Fout bij teller:", error);

        document.getElementById("aantal").textContent = "-";

        document.getElementById("fout").textContent =
            "Teller kon niet worden geladen.";

        return;
    }

    document.getElementById("aantal").textContent =
        Number(data).toLocaleString("nl-BE");
}


verhoogTeller();

</script>

</body>
</html>
