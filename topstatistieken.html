/* ============================================================

   ============================================================ */

function datumNL(datum) {

    return new Date(
        datum + "T00:00:00"
    ).toLocaleDateString(
        "nl-BE",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/* ============================================================
   TOPSERIE
   ============================================================ */

function bepaalTopserie(scores) {

    let beste = null;

    scores.forEach(r => {

        const game1 =
            Number(r.game1) || 0;

        const game2 =
            Number(r.game2) || 0;

        const game3 =
            Number(r.game3) || 0;

        const serie =
            game1 + game2 + game3;

        if (
            game1 > 0 &&
            game2 > 0 &&
            game3 > 0
        ) {

            if (
                !beste ||
                serie > beste.serie
            ) {

                beste = {
                    speler: r.speler,
                    game1,
                    game2,
                    game3,
                    serie,
                    gemiddelde: serie / 3,
                    datum: r.speeldatum
                };

            }

        }

    });

    return beste;
}


/* ============================================================
   TOPMATCH
   ============================================================ */

function bepaalTopmatch(scores) {

    let beste = null;

    Object.entries(WEDSTRIJDEN)
        .forEach(([datum, wedstrijden]) => {

        wedstrijden.forEach(
            ([thuis, uit]) => {

            if (
                thuis !== RNB &&
                uit !== RNB
            ) {
                return;
            }

            const scoreThuis =
                scores.find(r =>
                    r.speeldatum === datum &&
                    r.ploeg === thuis
                );

            const scoreUit =
                scores.find(r =>
                    r.speeldatum === datum &&
                    r.ploeg === uit
                );

            if (
                !scoreThuis ||
                !scoreUit
            ) {
                return;
            }

            const puntenThuis =
                Number(scoreThuis.punten) || 0;

            const puntenUit =
                Number(scoreUit.punten) || 0;

            const verschil =
                Math.abs(
                    puntenThuis -
                    puntenUit
                );

            if (
                !beste ||
                verschil > beste.verschil
            ) {

                beste = {
                    datum,
                    thuis,
                    uit,
                    puntenThuis,
                    puntenUit,
                    verschil,
                    kegelsThuis:
                        Number(scoreThuis.kegels) || 0,
                    kegelsUit:
                        Number(scoreUit.kegels) || 0
                };

            }

        });

    });

    if (!beste)
        return null;


    beste.gemiddeldeThuis =
        beste.kegelsThuis / 15;

    beste.gemiddeldeUit =
        beste.kegelsUit / 15;


    return beste;
}


/* ============================================================
   KLASSEMENT
   ============================================================ */

function bepaalKlassement(scores) {

    if (!scores.length)
        return null;


    const datums = [
        ...new Set(
            scores.map(r => r.speeldatum)
        )
    ].sort();


    const laatsteDatum =
        datums[datums.length - 1];


    const gespeeldeScores =
        scores.filter(r =>
            r.speeldatum <= laatsteDatum
        );


    const teams = {};


    gespeeldeScores.forEach(r => {

        const ploeg =
            r.ploeg;


        if (!teams[ploeg]) {

            teams[ploeg] = {

                ploeg,
                punten: 0,
                kegels: 0,
                gespeeld: 0

            };

        }


        teams[ploeg].punten +=
            Number(r.punten) || 0;


        teams[ploeg].kegels +=
            Number(r.kegels) || 0;


        teams[ploeg].gespeeld++;

    });


    const klassement =
        Object.values(teams);


    klassement.sort((a, b) => {

        if (
            b.punten !== a.punten
        ) {

            return b.punten -
                   a.punten;

        }


        return b.kegels -
               a.kegels;

    });


    klassement.forEach(
        (team, index) => {

        team.plaats =
            index + 1;

    });


    return {

        datum:
            laatsteDatum,

        teams:
            klassement

    };

}

        <div class="podium-team
            ${isRNB ? "rnb-podium" : ""}">

            ${team.ploeg}

        </div>


        <div class="podium-punten">

            ${team.punten} punten

        <div class="podium-gemiddelde">

            Gemiddelde:
            <strong>
                ${gemiddelde.toFixed(1)}
            </strong>

        </div>

    `;

}


/* ============================================================
   VERSCHIL KLEUR
   ============================================================ */

function verschilHTML(waarde, eenheid) {

    let klasse = "verschil-nul";

    if (waarde < 0) {
        klasse = "verschil-negatief";
    }

    if (waarde > 0) {
        klasse = "verschil-positief";
    }


    const teken =
        waarde > 0
            ? "+"
            : "";


    return `

        <span class="${klasse}">

            ${teken}${waarde}
            ${eenheid}

        </span>

    `;

}

                        ${verschilHTML(
                            verschilPunten,
                            " punten"
                        )}

                        &nbsp; · &nbsp;

                        ${verschilHTML(
                            verschilKegels,
                            " kegels"
                        )}

                    </div>


                </div>


            </div>


        </div>

    `;

}


/* ============================================================
   TOPSTATISTIEKEN TONEN
   ============================================================ */

function toonTopstatistieken(
    topserie,
    topmatch,
    klassement
) {

    const inhoud =
        document.getElementById(
            "inhoud"
        );


    let html = "";


    /* ========================================================
       TOPSERIE
       ======================================================== */

    if (topserie) {

        html += `

        <div class="banner topserie">

            <h2>
                🏆 TOPSERIE EVER
            </h2>


            <div class="naam">

                ${topserie.speler}

            </div>


            <div class="gegevens">


                <div class="gegeven">

                    <div class="gegeven-label">
                        Game 1
                    </div>

                    <div class="gegeven-waarde">
                        ${topserie.game1}
                    </div>

                </div>


                <div class="gegeven">

                    <div class="gegeven-label">
                        Game 2
                    </div>

                    <div class="gegeven-waarde">
                        ${topserie.game2}
                    </div>

                </div>


                <div class="gegeven">

                    <div class="gegeven-label">
                        Game 3
                    </div>

                    <div class="gegeven-waarde">
                        ${topserie.game3}
                    </div>

                </div>


                <div class="gegeven">

                    <div class="gegeven-label">
                        Serie
                    </div>

                    <div class="gegeven-waarde serie">
                        ${topserie.serie}
                    </div>

                </div>


                <div class="gegeven">

                    <div class="gegeven-label">
                        Gemiddelde
                    </div>

                    <div class="gegeven-waarde">
                        ${topserie.gemiddelde.toFixed(1)}
                    </div>

                </div>


                <div class="gegeven">

                    <div class="gegeven-label">
                        Datum
                    </div>

                    <div
                        class="gegeven-waarde"
                        style="font-size:16px;"
                    >

                        ${datumNL(
                            topserie.datum
                        )}

                    </div>

                </div>


            </div>

        </div>

        `;

    }


    /* ========================================================
       TOPMATCH
       ======================================================== */

    if (topmatch) {

        const rnbIsThuis =
            topmatch.thuis === RNB;


        const tegenstander =
            rnbIsThuis
                ? topmatch.uit
                : topmatch.thuis;


        const rnbPunten =
            rnbIsThuis
                ? topmatch.puntenThuis
                : topmatch.puntenUit;


        const tegenPunten =
            rnbIsThuis
                ? topmatch.puntenUit
                : topmatch.puntenThuis;


        const rnbKegels =
            rnbIsThuis
                ? topmatch.kegelsThuis
                : topmatch.kegelsUit;


        const tegenKegels =
            rnbIsThuis
                ? topmatch.kegelsUit
                : topmatch.kegelsThuis;


        const rnbGem =
            rnbIsThuis
                ? topmatch.gemiddeldeThuis
                : topmatch.gemiddeldeUit;


        const tegenGem =
            rnbIsThuis
                ? topmatch.gemiddeldeUit
                : topmatch.gemiddeldeThuis;


        html += `

        <div class="banner topmatch">


            <h2>
                ⚔️ TOPMATCH EVER
            </h2>


            <div class="tegen">

                RNB Geenens Construct-Vapor
                —
                ${tegenstander}

            </div>


            <div class="match-info">


                <div class="match-item">

                    <div class="match-label">
                        Datum
                    </div>

                    <div class="match-value">

                        ${datumNL(
                            topmatch.datum
                        )}

                    </div>

                </div>


                <div class="match-item">

                    <div class="match-label">
                        Punten
                    </div>

                    <div class="match-value">

                        ${rnbPunten}
                        -
                        ${tegenPunten}

                    </div>

                </div>


                <div class="match-item">

                    <div class="match-label">
                        Kegels
                    </div>

                    <div class="match-value">

                        ${rnbKegels}
                        -
                        ${tegenKegels}

                    </div>

                </div>


                <div class="match-item">

                    <div class="match-label">
                        Gemiddelde
                    </div>

                    <div class="match-value">

                        ${rnbGem.toFixed(1)}
                        -
                        ${tegenGem.toFixed(1)}

                    </div>

                </div>


                <div class="match-item">

                    <div class="match-label">
                        Puntenverschil
                    </div>

                    <div class="match-value">

                        ${topmatch.verschil}

                    </div>

                </div>


            </div>

        </div>

        `;

    }


    /* ========================================================
       PODIUM
       ======================================================== */

    html +=
        maakPodium(
            klassement
        );


    if (!html) {

        html = `

            <div class="loading">

                Nog geen gegevens beschikbaar.

            </div>

        `;

    }


    inhoud.innerHTML =
        html;

}


/* ============================================================
   DATA LADEN
   ============================================================ */

async function laadData() {

    try {


        const [
            bowlingResult,
            interteamResult
        ] = await Promise.all([


            supabaseClient
                .from("bowling_scores")
                .select("*")
                .order(
                    "speeldatum",
                    {
                        ascending: true
                    }
                ),


            supabaseClient
                .from("interteam_scores")
                .select("*")
                .order(
                    "speeldatum",
                    {
                        ascending: true
                    }
                )

        ]);


        if (bowlingResult.error)
            throw bowlingResult.error;


        if (interteamResult.error)
            throw interteamResult.error;


        const bowlingScores =
            bowlingResult.data || [];


        const interteamScores =
            interteamResult.data || [];


        const topserie =
            bepaalTopserie(
                bowlingScores
            );


        const topmatch =
            bepaalTopmatch(
                interteamScores
            );


        const klassement =
            bepaalKlassement(
                interteamScores
            );


        toonTopstatistieken(
            topserie,
            topmatch,
            klassement
        );


    } catch (error) {

        console.error(error);


        document.getElementById(
            "inhoud"
        ).innerHTML = `

            <div class="error">

                Fout bij het laden van de
                statistieken.

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


/* ============================================================
   START
   ============================================================ */

laadData();

</script>

</body>
</html>
