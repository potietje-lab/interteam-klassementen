/* =========================================
   BASIS
   ========================================= */

* {

}

}

}

.section {
    background: white;

h1 {

h2 {

}

   ========================================= */

        55px

// =====================================================
// ALLE SCOREGEGEVENS
// =====================================================

let alleScores = [];

let alleTeams = [];


// =====================================================
// DATUM OPMAAK
// =====================================================

function datumTekst(datum) {

    const d =
        datum.split("-");

    return (
        d[2] +
        "/" +
        d[1] +
        "/" +
        d[0]
    );

}


// =====================================================
// NAAM NORMALISEREN
// =====================================================

function normaliseer(naam) {

    return String(
        naam || ""
    )
    .replace(
        /\s+/g,
        " "
    )
    .trim()
    .toLowerCase();

}


// =====================================================
// HTML VEILIG MAKEN
// =====================================================

function escapeHtml(tekst) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        tekst;

    return div.innerHTML;

}


// =====================================================
// DATUM DROPDOWN LADEN
// =====================================================

function laadDatums() {

    const select =
        document.getElementById(
            "datumSelect"
        );


    select.innerHTML = "";


    DATUMS.forEach(
        datum => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                datum;

            option.textContent =
                datumTekst(
                    datum
                );

            select.appendChild(
                option
            );

        }
    );


    /*
     * Zoek de laatste speeldatum
     * waarvoor minstens één score
     * in Supabase staat.
     */

    const gespeeldeDatums =
        DATUMS.filter(
            datum =>
                alleScores.some(
                    score =>
                        score.speeldatum ===
                        datum
                )
        );


    if (
        gespeeldeDatums.length > 0
    ) {

        select.value =
            gespeeldeDatums[
                gespeeldeDatums.length - 1
            ];

    } else {

        select.value =
            DATUMS[0];

    }

}


// =====================================================
// SCORE OPZOEKEN
// =====================================================

function zoekScore(
    ploeg,
    datum
) {

    const gevonden =
        alleScores.find(
            score =>

                score.speeldatum ===
                datum &&

                normaliseer(
                    score.ploeg
                ) ===
                normaliseer(
                    ploeg
                )
        );


    if (!gevonden) {

        return null;

    }


    return {

        kegels:
            Number(
                gevonden.kegels
            ) || 0,

        punten:
            Number(
                gevonden.punten
            ) || 0

    };

}


// =====================================================
// GEMIDDELDE
// =====================================================

function berekenGemiddelde(
    kegels
) {

    if (
        kegels === null ||
        kegels === undefined
    ) {

        return null;

    }


    return (
        Number(kegels) /
        AANTAL_SPELERS
    );

}


// =====================================================
// TEAM OPZOEKEN
// =====================================================

function zoekTeam(naam) {

    return alleTeams.find(
        team =>
            normaliseer(team.naam) ===
            normaliseer(naam)
    ) || null;

}


// =====================================================
// STAND EN PUNTEN PER DATUM
// =====================================================

function berekenStand(datum) {

    const stand = {};

    alleTeams.forEach(team => {
        stand[team.naam] = {
            naam: team.naam,
            punten: 0,
            kegels: 0
        };
    });

    alleScores.forEach(score => {

        if (score.speeldatum > datum) {
            return;
        }

        const team = zoekTeam(score.ploeg);

        if (!team) {
            return;
        }

        if (!stand[team.naam]) {
            stand[team.naam] = {
                naam: team.naam,
                punten: 0,
                kegels: 0
            };
        }

        stand[team.naam].punten += Number(score.punten) || 0;
        stand[team.naam].kegels += Number(score.kegels) || 0;

    });

    return Object.values(stand).sort(
        (a, b) =>
            b.punten - a.punten ||
            b.kegels - a.kegels ||
            a.naam.localeCompare(b.naam)
    );

}


function ploegInfo(naam, stand) {

    const team = zoekTeam(naam);

    const teamStand =
        stand.find(
            item =>
                normaliseer(item.naam) ===
                normaliseer(naam)
        );

    const punten =
        teamStand?.punten || 0;

    const kegels =
        teamStand?.kegels || 0;

    // Zolang een team nog geen enkele score heeft,
    // krijgt het geen rangnummer.
    const positie =
        (punten === 0 && kegels === 0)
            ? "—"
            : stand.findIndex(
                item =>
                    normaliseer(item.naam) ===
                    normaliseer(naam)
              ) + 1;

    return {
        locatie: team?.Locatie || "Locatie onbekend",
        positie: positie,
        punten: punten
    };

}

// WEDSTRIJDEN TONEN
// =====================================================

        document.getElementById(
            "datumSelect"
        );


    const datum =
        select.value;


    const container =
        document.getElementById(
            "wedstrijden"
        );


    const titel =
        document.getElementById(
            "titelDatum"
        );


    titel.innerText =
        "Speeldag " +
        datumTekst(
            datum
        );


    container.innerHTML = "";


    const wedstrijden =
        WEDSTRIJDEN[
            datum
        ] || [];

    const stand =
        berekenStand(datum);


    if (
        wedstrijden.length === 0
    ) {

        container.innerHTML = `

            <div class="no-data">

                Geen wedstrijden gevonden.

            </div>

        `;

        return;

    }


    wedstrijden.forEach(
        wedstrijd => {

            const ploeg1 =
                wedstrijd[0];

            const ploeg2 =
                wedstrijd[1];

            const info1 =
                ploegInfo(ploeg1, stand);

            const info2 =
                ploegInfo(ploeg2, stand);


            const score1 =
                zoekScore(
                    ploeg1,
                    datum
                );


            const score2 =
                zoekScore(
                    ploeg2,
                    datum
                );


            const gem1 =
                score1
                    ? berekenGemiddelde(
                        score1.kegels
                      )
                    : null;


            const gem2 =
                score2
                    ? berekenGemiddelde(
                        score2.kegels
                      )
                    : null;


            const punten1 =
                score1
                    ? score1.punten
                    : "—";


            const punten2 =
                score2
                    ? score2.punten
                    : "—";


            const kegels1 =
                score1
                    ? score1.kegels
                    : "—";


            const kegels2 =
                score2
                    ? score2.kegels
                    : "—";


            const gemiddelde1 =
                gem1 !== null
                    ? gem1.toFixed(2)
                    : "—";


            const gemiddelde2 =
                gem2 !== null
                    ? gem2.toFixed(2)
                    : "—";


            const isZero1 =
                score1 &&
                Number(
                    score1.punten
                ) === 0;


            const isZero2 =

                Number(
                    score2.punten
                ) === 0;


            const isRNB1 =

                ) ===

                    RNB
                );


            const isRNB2 =
                normaliseer(
                    ploeg2
                ) ===
                normaliseer(
                    RNB
                );


            const row =

// =====================================================
// RNB RESULTATEN TONEN
// =====================================================

function toonRnbResultaten() {

    const container = document.getElementById("rnbResultaten");
    if (!container) return;

    const resultaten = [];

    DATUMS.forEach(datum => {
        const wedstrijden = WEDSTRIJDEN[datum] || [];

        wedstrijden.forEach(wedstrijd => {
            const ploeg1 = wedstrijd[0];
            const ploeg2 = wedstrijd[1];

            if (normaliseer(ploeg1) !== normaliseer(RNB) &&
                normaliseer(ploeg2) !== normaliseer(RNB)) return;

            const tegenstander = normaliseer(ploeg1) === normaliseer(RNB) ? ploeg2 : ploeg1;
            const scoreRNB = zoekScore(RNB, datum);
            const scoreTegenstander = zoekScore(tegenstander, datum);

            if (!scoreRNB || !scoreTegenstander) return;

            let resultaat = "gelijk";
            if (scoreRNB.punten > scoreTegenstander.punten) resultaat = "gewonnen";
            if (scoreRNB.punten < scoreTegenstander.punten) resultaat = "verloren";

            resultaten.push({ datum, tegenstander, rnbPunten: scoreRNB.punten, tegenstanderPunten: scoreTegenstander.punten, resultaat });
        });
    });

    const gewonnen = resultaten.filter(x => x.resultaat === "gewonnen");
    const verloren = resultaten.filter(x => x.resultaat === "verloren");
    const gelijk = resultaten.filter(x => x.resultaat === "gelijk");

    function lijst(items, titel, klasse, leegtekst) {
        let html = `<div class="resultaat-lijst"><h3 class="${klasse}">${titel} (${items.length})</h3><ul>`;
        if (!items.length) html += `<li>${leegtekst}</li>`;
        items.forEach(item => {
            html += `<li>${datumTekst(item.datum)} — <strong>${escapeHtml(item.tegenstander)}</strong> (${item.rnbPunten} - ${item.tegenstanderPunten})</li>`;
        });
        return html + `</ul></div>`;
    }

    let html = `<h2>🏆 Wedstrijden RNB Geenens</h2>`;
    html += lijst(gewonnen, "✅ Gewonnen", "resultaat-gewonnen", "Nog geen gewonnen wedstrijden.");
    html += lijst(verloren, "❌ Verloren", "resultaat-verloren", "Nog geen verloren wedstrijden.");
    if (gelijk.length) html += lijst(gelijk, "➖ Gelijk", "resultaat-gelijk", "");

    container.innerHTML = html;
}

async function laadScores() {

    const container =
        document.getElementById(
            "wedstrijden"
        );


    container.innerHTML =
        "Gegevens worden geladen...";


    const {
        data: teamsData,
        error: teamsError
    } = await supabaseClient

        .from("teams")
        .select("id, naam, Locatie")
        .eq("actief", true)
        .order("naam", { ascending: true });


    if (teamsError) {

        console.error("Fout bij laden teams:", teamsError);

        container.innerHTML = `
            <div
                class="no-data"
                style="color:red;">
                ❌ Fout bij het ophalen van de teamgegevens uit Supabase.
            </div>
        `;

        return;

    }


    alleTeams = teamsData || [];


    const {
        data,
        error
    } = await supabaseClient

        .from(
            SCORE_TABEL
        )

        .select(
            "speeldatum, ploeg, kegels, punten"
        );


    if (error) {

        console.error(
            "Supabase fout:",
            error
        );


        container.innerHTML = `

            <div
                class="no-data"
                style="color:red;">

                ❌ Fout bij het ophalen
                van de gegevens uit Supabase.

            </div>

        `;


        return;

    }


    alleScores =
        data || [];


    // Dropdown vullen

    laadDatums();


    // Laatste gespeelde datum tonen

    toonWedstrijden();
    toonRnbResultaten();

}
