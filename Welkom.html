
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roll & Bowl</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: transparent;
    overflow: hidden;
}


/* =====================================================
   WELKOMSTSCHERM
   ===================================================== */

#welcomeScreen {
    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: rgba(0, 0, 0, 0.88);

    z-index: 1000;

    text-align: center;

    padding: 20px;

    overflow-y: auto;
}


/* =====================================================
   WELKOMSTTEKST
   ===================================================== */

#welcomeText {
    color: white;

    font-size: clamp(24px, 5vw, 42px);

    font-weight: bold;

    margin-bottom: 22px;

    animation: fadeIn 1.5s ease-in-out;
}


/* =====================================================
   HUIDIGE STAND
   ===================================================== */

#standBox {

    width: min(95%, 520px);

    background: rgba(255,255,255,0.96);

    border-radius: 16px;

    padding: 15px 18px;

    margin-bottom: 25px;

    box-shadow:
        0 6px 20px rgba(0,0,0,0.35);

    animation: fadeIn 1.5s ease-in-out;
}


#standTitle {

    font-size: 19px;

    font-weight: bold;

    color: #222;

    margin-bottom: 12px;

}


#standTeam {

    font-size: 15px;

    font-weight: bold;

    color: #333;

    margin-bottom: 12px;

}


/* =====================================================
   STAND TABEL
   ===================================================== */

#standTable {

    width: 100%;

    border-collapse: collapse;

    table-layout: fixed;
}


#standTable th {

    background: #222;

    color: white;

    padding: 9px 5px;

    font-size: 13px;

}


#standTable td {

    padding: 10px 5px;

    font-size: 16px;

    font-weight: bold;

    color: #222;

    border-bottom: 1px solid #ddd;

}


/* =====================================================
   KLEUR RANG
   ===================================================== */

#standTable td.rangGroen {

    background: #28a745 !important;

    color: white !important;

    font-weight: bold;

}


#standTable td.rangGeel {

    background: #ffc107 !important;

    color: #222 !important;

    font-weight: bold;

}


#standTable td.rangRood {

    background: #dc3545 !important;

    color: white !important;

    font-weight: bold;

}


/* =====================================================
   LAADTEKST
   ===================================================== */

#standLoading {

    font-size: 14px;

    color: #555;

}


#standError {

    font-size: 14px;

    color: #b00020;

    font-weight: bold;

}


/* =====================================================
   BOWLINGBAL
   ===================================================== */

#bowlingBall {

    width: 110px;
    height: 110px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #555,
            #111 55%,
            #000
        );

    box-shadow:
        inset -10px -12px 20px rgba(0,0,0,0.8),
        0 8px 25px rgba(0,0,0,0.6);

    position: relative;

    cursor: pointer;

    animation: bounce 2s infinite;

    transition: transform 0.3s;
}


#bowlingBall:hover {

    transform: scale(1.12);

}


/* =====================================================
   GATEN IN BOWLINGBAL
   ===================================================== */

.hole {

    position: absolute;

    width: 17px;
    height: 17px;

    border-radius: 50%;

    background: #000;

    box-shadow:
        inset 2px 2px 5px rgba(255,255,255,0.15);
}


.hole1 {

    top: 25px;
    left: 35px;

}


.hole2 {

    top: 22px;
    left: 58px;

}


.hole3 {

    top: 43px;
    left: 47px;

}


/* =====================================================
   KLIKTEXT
   ===================================================== */

#clickText {

    color: white;

    font-size: 16px;

    margin-top: 18px;

    opacity: 0.9;

}


/* =====================================================
   ANIMATIES
   ===================================================== */

@keyframes fadeIn {

    from {

        opacity: 0;

        transform: translateY(-20px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}


@keyframes bounce {

    0%, 100% {

        transform: translateY(0);

    }

    50% {

        transform: translateY(-15px);

    }

}



/* =====================================================
   BELANGRIJKE MEDEDELING POPUP
   ===================================================== */

#importantPopup {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.72);
    z-index: 2000;
    padding: 20px;
}

#importantPopup.show {
    display: flex;
}

#importantPopupBox {
    width: min(95%, 520px);
    background: white;
    border-radius: 18px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
    animation: importantPopupOpen 0.35s ease;
}

#importantPopupTitle {
    margin: 0 0 16px 0;
    font-size: 26px;
    color: #d32f2f;
}

#importantPopupText {
    margin: 0 0 24px 0;
    font-size: 18px;
    line-height: 1.55;
    color: #222;
}

#importantPopupButton {
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    background: #1976d2;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#importantPopupButton:hover {
    background: #125ca3;
}

@keyframes importantPopupOpen {
    from {
        opacity: 0;
        transform: scale(0.82);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* =====================================================
   GSM
   ===================================================== */

@media (max-width: 600px) {

    #welcomeScreen {

        padding: 15px;

    }


    #welcomeText {

        font-size: 27px;

        line-height: 1.3;

        margin-bottom: 18px;

    }


    #standBox {

        width: 96%;

        padding: 12px;

        margin-bottom: 20px;

    }


    #standTitle {

        font-size: 17px;

    }


    #standTeam {

        font-size: 13px;

    }


    #standTable th {

        font-size: 11px;

        padding: 8px 3px;

    }


    #standTable td {

        font-size: 14px;

        padding: 9px 3px;

    }


    #bowlingBall {

        width: 90px;

        height: 90px;

    }


    .hole {

        width: 14px;

        height: 14px;

    }


    .hole1 {

        top: 20px;

        left: 28px;

    }


    .hole2 {

        top: 18px;

        left: 48px;

    }


    .hole3 {

        top: 36px;

        left: 38px;

    }


    #clickText {

        font-size: 14px;

        margin-top: 15px;

    }

    #importantPopupBox {
        padding: 24px 18px;
    }

    #importantPopupTitle {
        font-size: 22px;
    }

    #importantPopupText {
        font-size: 17px;
    }

    #importantPopupButton {
        width: 100%;
    }

}

</style>
</head>


<body>

<!-- =====================================================
     BELANGRIJKE MEDEDELING
     ===================================================== -->

<div id="importantPopup">

    <div id="importantPopupBox">

        <h2 id="importantPopupTitle">
            📢 BELANGRIJKE MEDEDELING
        </h2>

        <p id="importantPopupText">
            Hier komt je belangrijke mededeling.
        </p>

        <button id="importantPopupButton" onclick="sluitBelangrijkeMelding()">
            OK, begrepen
        </button>

    </div>

</div>



<!-- =====================================================
     WELKOMSTSCHERM
     ===================================================== -->

<div id="welcomeScreen">


    <div id="welcomeText"></div>


    <!-- =================================================
         HUIDIGE STAND
         ================================================= -->

    <div id="standBox">

        <div id="standTitle">

            🏆 Huidige stand van de ploeg

        </div>


        <div id="standTeam">

            RNB Geenens Construct-Vapor

        </div>


        <div id="standLoading">

            Stand wordt geladen...

        </div>


        <div id="standError"
             style="display:none;">

        </div>


        <table id="standTable"
               style="display:none;">

            <thead>

                <tr>

                    <th>Rang</th>
                    <th>Punten</th>
                    <th>Kegels</th>
                    <th>Gemiddelde</th>

                </tr>

            </thead>


            <tbody>

                <tr>

                    <td id="rang">-</td>

                    <td id="punten">-</td>

                    <td id="kegels">-</td>

                    <td id="gemiddelde">-</td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- =================================================
         BOWLINGBAL
         ================================================= -->

    <div id="bowlingBall"
         onclick="closeWelcome()">

        <div class="hole hole1"></div>

        <div class="hole hole2"></div>

        <div class="hole hole3"></div>

    </div>


    <div id="clickText">

        Klik op de bowlingbal om verder te gaan 🎳

    </div>


</div>


<script>



/* =====================================================
   INSTELLINGEN BELANGRIJKE MEDEDELING
   ===================================================== */

/*
   true  = popup tonen
   false = popup niet tonen
*/
const POPUP_ACTIEF = false;

/*
   TITEL VAN DE MEDEDELING
*/
const POPUP_TITEL = "📢 BELANGRIJKE MEDEDELING";

/*
   TEKST VAN DE MEDEDELING
*/
const POPUP_TEKST =
    " Hier komt je belangrijke mededeling.";


/* =====================================================
   POPUP TONEN
   ===================================================== */

function toonBelangrijkeMelding() {

    if (!POPUP_ACTIEF) {
        return;
    }

    document.getElementById("importantPopupTitle").textContent =
        POPUP_TITEL;

    document.getElementById("importantPopupText").textContent =
        POPUP_TEKST;

    document.getElementById("importantPopup").classList.add("show");
}


/* =====================================================
   POPUP SLUITEN
   ===================================================== */

function sluitBelangrijkeMelding() {

    document.getElementById("importantPopup").classList.remove("show");
}


/* Popup automatisch tonen */
window.addEventListener("load", function() {

    toonBelangrijkeMelding();

});



/* =====================================================
   DAG- EN TIJDGEBONDEN WELKOMSTTEKST
   ===================================================== */

function bepaalBegroeting() {

    const nu = new Date();
    const uur = nu.getHours();
    const dag = nu.getDay();

    let begroeting;

    if (uur >= 5 && uur < 12) {
        begroeting = "Goede morgen";
    }
    else if (uur >= 12 && uur < 18) {
        begroeting = "Goede middag";
    }
    else {
        begroeting = "Goede avond";
    }

    const teksten = {

        1: "Maandag, we starten de week met volle moed! 💪",
        2: "Dinsdag, trainingsdag! 🎳",
        3: "Woensdag, we zijn halfweg…! ⭐",
        4: "Donderdag, nog even doorzetten… de finish komt eraan! 🚀",
        5: "Vrijdag, tijd om te stralen! ✨",
        6: "Zaterdag, weekendmodus: genieten maar! 😎",
        0: "Zondag, een mooie dag om de batterijen op te laden! ☀️"

    };

    document.getElementById("welcomeText").innerHTML =
        begroeting + "<br>" + teksten[dag];
}


/* Welkomsttekst tonen */
bepaalBegroeting();

/* =====================================================
   SUPABASE VERBINDING
   ===================================================== */

const SUPABASE_URL =
    "https://wnsvbtskynkewxggmjem.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_9d-2CTihH00Q9gUzLYI6lA_13GHTmCx";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   INSTELLINGEN
   ===================================================== */

const SCORE_TABEL =
    "interteam_scores";


const RNB =
    "RNB Geenens Construct-Vapor";


const AANTAL_SPELERS =
    15;


/* =====================================================
   NAAR ROLL & BOWL HOMEPAGE
   ===================================================== */

function closeWelcome() {

    window.top.location.href =
        "https://sites.google.com/view/rollbowl/homepage";

}


/* =====================================================
   HUIDIGE STAND OPHALEN
   ===================================================== */

async function laadHuidigeStand() {


    const loading =
        document.getElementById(
            "standLoading"
        );


    const errorElement =
        document.getElementById(
            "standError"
        );


    const table =
        document.getElementById(
            "standTable"
        );


    try {


        /* ---------------------------------------------
           GEGEVENS UIT SUPABASE
           --------------------------------------------- */

        const { data, error } =
            await supabaseClient

                .from(SCORE_TABEL)

                .select(
                    "speeldatum, ploeg, kegels, punten"
                );


        if (error) {

            console.error(
                "Supabase fout:",
                error
            );

            throw error;

        }


        const scores =
            data || [];


        /* ---------------------------------------------
           PLOEGEN SAMENVOEGEN
           --------------------------------------------- */

        const teams = {};


        scores.forEach(score => {


            const ploeg =
                score.ploeg;


            if (!teams[ploeg]) {

                teams[ploeg] = {

                    ploeg: ploeg,

                    punten: 0,

                    kegels: 0,

                    datums: new Set()

                };

            }


            teams[ploeg].punten +=
                Number(score.punten) || 0;


            teams[ploeg].kegels +=
                Number(score.kegels) || 0;


            teams[ploeg].datums.add(
                score.speeldatum
            );


        });


        /* ---------------------------------------------
           LIJST VAN PLOEGEN
           --------------------------------------------- */

        const lijst =
            Object.values(teams);


        /* ---------------------------------------------
           SORTEREN
           1. PUNTEN
           2. KEGELS
           --------------------------------------------- */

        lijst.sort(
            (a, b) => {

                if (
                    b.punten !==
                    a.punten
                ) {

                    return (
                        b.punten -
                        a.punten
                    );

                }


                return (
                    b.kegels -
                    a.kegels
                );

            }
        );


        /* ---------------------------------------------
           RNB ZOEKEN
           --------------------------------------------- */

        const rnbIndex =
            lijst.findIndex(
                team =>
                    normaliseer(team.ploeg) ===
                    normaliseer(RNB)
            );


        /* ---------------------------------------------
           GEEN RNB GEVONDEN
           --------------------------------------------- */

        if (rnbIndex === -1) {

            loading.style.display =
                "none";


            errorElement.style.display =
                "block";


            errorElement.innerText =
                "Nog geen scores voor onze ploeg.";


            return;

        }


        /* ---------------------------------------------
           RNB GEGEVENS
           --------------------------------------------- */

        const team =
            lijst[rnbIndex];


        const aantalSpeeldagen =
            team.datums.size;


        /* ---------------------------------------------
           GEMIDDELDE
           --------------------------------------------- */

        const gemiddelde =
            aantalSpeeldagen > 0

                ? team.kegels /
                  (
                      aantalSpeeldagen *
                      AANTAL_SPELERS
                  )

                : 0;


        /* ---------------------------------------------
           RANG
           --------------------------------------------- */

        const rang =
            rnbIndex + 1;


        const rangElement =
            document.getElementById(
                "rang"
            );


        rangElement.textContent =
            rang;


        /* ---------------------------------------------
           RANG KLEUR GEVEN
           --------------------------------------------- */

        rangElement.classList.remove(
            "rangGroen",
            "rangGeel",
            "rangRood"
        );


        if (rang === 1) {

            rangElement.classList.add(
                "rangGroen"
            );

        }

        else if (rang === 2) {

            rangElement.classList.add(
                "rangGeel"
            );

        }

        else {

            rangElement.classList.add(
                "rangRood"
            );

        }


        /* ---------------------------------------------
           PUNTEN
           --------------------------------------------- */

        document.getElementById(
            "punten"
        ).textContent =
            team.punten;


        /* ---------------------------------------------
           KEGELS
           --------------------------------------------- */

        document.getElementById(
            "kegels"
        ).textContent =
            team.kegels.toLocaleString(
                "nl-BE"
            );


        /* ---------------------------------------------
           GEMIDDELDE
           --------------------------------------------- */

        document.getElementById(
            "gemiddelde"
        ).textContent =
            gemiddelde.toFixed(2);


        /* ---------------------------------------------
           TABEL TONEN
           --------------------------------------------- */

        loading.style.display =
            "none";


        table.style.display =
            "table";


    }


    catch (err) {


        console.error(
            "Fout bij laden stand:",
            err
        );


        loading.style.display =
            "none";


        errorElement.style.display =
            "block";


        errorElement.innerText =
            "❌ De stand kon niet worden geladen.";

    }

}


/* =====================================================
   NAMEN NORMALISEREN
   ===================================================== */

function normaliseer(naam) {

    return String(
        naam || ""
    )

    .replace(
        /\s+/g,
        " "
    )

    .trim()

    .toLowerCase();

}


/* =====================================================
   STAND LADEN
   ===================================================== */

laadHuidigeStand();


</script>

</body>
</html>
```
