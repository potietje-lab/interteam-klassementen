<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team top game</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px;color:#222}
.container{max-width:700px;margin:auto}
h1{text-align:center;margin-bottom:8px}
.team{text-align:center;font-size:20px;font-weight:bold;margin-bottom:25px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card{background:#fff;border-radius:12px;padding:22px 10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.game{font-size:18px;font-weight:bold;margin-bottom:10px}
.score{font-size:42px;font-weight:bold}
.date{margin-top:10px;color:#666;font-size:14px}
.avg-label{margin-top:18px;font-size:13px;color:#666}
.average{font-size:22px;font-weight:bold;margin-top:4px}
.status{text-align:center;margin:20px 0;color:#666}
.error{color:#b00020;font-weight:bold}
@media(max-width:600px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>🏆 Team top game</h1>
<div class="team">RNB Geenens Construct-Vapor</div>
<div id="status" class="status">Scores worden geladen...</div>

<div class="cards">
<div class="card">
  <div class="game">Game 1</div>
  <div id="game1" class="score">-</div>
  <div id="date1" class="date"></div>
  <div class="avg-label">Ploeggemiddelde</div>
  <div id="avgBest1" class="average">-</div>
  <div class="avg-label">Gemiddelde tot nog toe</div>
  <div id="avgToDate1" class="average">-</div>
</div>
<div class="card">
  <div class="game">Game 2</div>
  <div id="game2" class="score">-</div>
  <div id="date2" class="date"></div>
  <div class="avg-label">Ploeggemiddelde</div>
  <div id="avgBest2" class="average">-</div>
  <div class="avg-label">Gemiddelde tot nog toe</div>
  <div id="avgToDate2" class="average">-</div>
</div>
<div class="card">
  <div class="game">Game 3</div>
  <div id="game3" class="score">-</div>
  <div id="date3" class="date"></div>
  <div class="avg-label">Ploeggemiddelde</div>
  <div id="avgBest3" class="average">-</div>
  <div class="avg-label">Gemiddelde tot nog toe</div>
  <div id="avgToDate3" class="average">-</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://wnsvbtskynkewxggmjem.supabase.co";
const SUPABASE_KEY="sb_publishable_9d-2CTihH00Q9gUzLYI6lA_13GHTmCx";

/*
  In players.team staat de ploeg als:
  RNB Geenens

  Op de website tonen we de volledige naam:
  RNB Geenens Construct-Vapor
*/
const DATABASE_TEAM="RNB Geenens";
const DISPLAY_TEAM="RNB Geenens Construct-Vapor";

const headers={
  "apikey":SUPABASE_KEY,
  "Authorization":"Bearer "+SUPABASE_KEY
};

function formatDate(s){
  const d=new Date(s+"T00:00:00");
  return d.toLocaleDateString("nl-BE",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

async function getJson(url){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),10000);

  try{
    const response=await fetch(url,{
      headers:headers,
      signal:controller.signal
    });

    const text=await response.text();

    if(!response.ok){
      throw new Error("Supabase fout "+response.status+": "+text);
    }

    return JSON.parse(text);
  }finally{
    clearTimeout(timeout);
  }
}

async function laadTopGames(){

  try{

    // 1. Spelers van RNB Geenens ophalen
    const playersUrl=
      SUPABASE_URL+
      "/rest/v1/players?select=id,name,team"+
      "&team=eq."+encodeURIComponent(DATABASE_TEAM);

    const players=await getJson(playersUrl);

    if(!players.length){
      throw new Error("Geen spelers gevonden voor "+DATABASE_TEAM+".");
    }

    // 2. Scores van deze spelers ophalen
    const playerIds=players.map(p=>p.id);

    const scoresUrl=
      SUPABASE_URL+
      "/rest/v1/bowling_scores"+
      "?select=speeldatum,speler,game1,game2,game3,player_id"+
      "&player_id=in.("+playerIds.join(",")+")"+
      "&order=speeldatum.asc";

    const scores=await getJson(scoresUrl);

    if(!scores.length){
      throw new Error(
        "Er zijn geen bowling scores gevonden voor "+DATABASE_TEAM+"."
      );
    }

    /*
      Per speeldatum bewaren we:
      - het totaal van de ploeg per game
      - het aantal spelers met een score per game

      Daardoor kunnen we het echte ploeggemiddelde berekenen:
      ploegtotaal / aantal spelers met een score.
    */
    const perDatum={};

    scores.forEach(row=>{

      if(!perDatum[row.speeldatum]){
        perDatum[row.speeldatum]={
          game1:{total:0,count:0},
          game2:{total:0,count:0},
          game3:{total:0,count:0}
        };
      }

      [1,2,3].forEach(n=>{
        const value=row["game"+n];

        if(value!==null && value!==undefined && value!==""){
          perDatum[row.speeldatum]["game"+n].total += Number(value);
          perDatum[row.speeldatum]["game"+n].count++;
        }
      });
    });

    const games=[1,2,3];

    // Hoogste ploegscore per game bepalen
    const beste=games.map(n=>({
      score:-1,
      datum:null,
      gemiddelde:0
    }));

    // Gemiddelde tot nog toe per game:
    // alle scores van alle gespeelde speeldagen samen / aantal scores.
    const totaalTotNogToe=games.map(n=>({
      total:0,
      count:0
    }));

    Object.entries(perDatum).forEach(([datum,data])=>{

      games.forEach(n=>{

        const g=data["game"+n];

        if(g.count>0){

          totaalTotNogToe[n-1].total += g.total;
          totaalTotNogToe[n-1].count += g.count;

          if(g.total>beste[n-1].score){
            beste[n-1]={
              score:g.total,
              datum:datum,
              gemiddelde:g.total/g.count
            };
          }
        }
      });
    });

    // Resultaten tonen
    games.forEach(n=>{

      const b=beste[n-1];
      const gemiddeldTotNogToe=
        totaalTotNogToe[n-1].count>0
          ? totaalTotNogToe[n-1].total / totaalTotNogToe[n-1].count
          : 0;

      document.getElementById("game"+n).textContent=
        b.score>=0 ? b.score : "-";

      document.getElementById("date"+n).textContent=
        b.datum ? formatDate(b.datum) : "";

      document.getElementById("avgBest"+n).textContent=
        b.gemiddelde>0 ? b.gemiddelde.toFixed(1) : "-";

      document.getElementById("avgToDate"+n).textContent=
        gemiddeldTotNogToe>0
          ? gemiddeldTotNogToe.toFixed(1)
          : "-";
    });

    document.getElementById("status").textContent=
      "Hoogste ploegtotalen en gemiddelden tot nu toe";

  }catch(error){

    console.error(error);

    const status=document.getElementById("status");

    status.textContent=error.message;
    status.className="status error";
  }
}
laadTopGames();
</script>
</body>
</html>
