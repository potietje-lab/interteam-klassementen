<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gary - Evolutie gemiddelde</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: white;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

h2 {
    text-align: center;
    margin-top: 5px;
    margin-bottom: 5px;
}

.subtitel {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
}

.grafiek {
    position: relative;
    width: 100%;
    height: 420px;
}

.status {
    text-align: center;
    font-size: 14px;
    margin-bottom: 10px;
    color: #666;
}

@media (max-width: 600px) {

    body {
        padding: 5px;
    }

    h2 {
        font-size: 20px;
    }

    .grafiek {
        height: 320px;
    }

}

</style>

</head>


<body>


<div class="container">


    <h2>
        🎳 Gary
    </h2>


    <div class="subtitel">
        Evolutie gemiddelde per speeldatum
    </div>


    <div id="status"
         class="status">

        Gemiddelden worden geladen...

    </div>


    <div class="grafiek">

        <canvas id="grafiek"></canvas>

    </div>


</div>



<script>


// ==================================================
// TESTMODUS
// ==================================================

// false = ECHTE SCORES UIT SUPABASE
// true  = voorbeeldscores

const TESTMODUS = false;



// ==================================================
// SUPABASE INSTELLINGEN
// ==================================================

const SUPABASE_URL =
    "https://wnsvbtskynkewxggmjem.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_9d-2CTihH00Q9gUzLYI6lA_13GHTmCx";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// ==================================================
// SPELER
// ==================================================

const SPELER = "Gary";



// ==================================================
// SPEELDATUMS
// ==================================================

const speeldatums = [

    "2026-09-04",
    "2026-09-11",
    "2026-09-18",
    "2026-09-25",
    "2026-10-02",
    "2026-10-09",
    "2026-10-16",
    "2026-11-20",
    "2026-11-27",
    "2026-12-04",
    "2026-12-11",
    "2027-01-15",
    "2027-01-22",
    "2027-01-29",
    "2027-02-19",
    "2027-02-26",
    "2027-03-19",
    "2027-03-26",
    "2027-04-16",
    "2027-04-23",
    "2027-05-07",
    "2027-05-14"

];



// ==================================================
// DATUM WEERGEVEN
// ==================================================

function toonDatum(datum) {

    const delen =
        datum.split("-");

    return (
        delen[2] +
        "/" +
        delen[1]
    );

}



// ==================================================
// GEMIDDELDE BEREKENEN
// ==================================================

function berekenGemiddelde(score) {

    const games = [

        Number(score.game1) || 0,

        Number(score.game2) || 0,

        Number(score.game3) || 0

    ];


    const geldigeGames =
        games.filter(
            game => game > 0
        );


    if (
        geldigeGames.length === 0
    ) {

        return null;

    }


    const totaal =
        geldigeGames.reduce(
            (som, game) =>
                som + game,
            0
        );


    return Number(
        (
            totaal /
            geldigeGames.length
        ).toFixed(2)
    );

}



// ==================================================
// ECHTE SCORES UIT SUPABASE LADEN
// ==================================================

async function laadSupabaseScores() {

    const status =
        document.getElementById(
            "status"
        );


    const { data, error } =

        await supabaseClient

        .from(
            "bowling_scores"
        )

        .select(
            "speeldatum, game1, game2, game3"
        )

        .eq(
            "speler",
            SPELER
        )

        .order(
            "speeldatum",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Supabase fout:",
            error
        );


        status.innerText =
            "❌ Fout bij laden van Supabase.";


        return;

    }


    console.log(
        "Scores uit Supabase:",
        data
    );


    const gegevens = [];


    speeldatums.forEach(
        datum => {


            const score =
                data.find(
                    item =>
                        item.speeldatum === datum
                );


            if (!score) {

                return;

            }


            const gemiddelde =
                berekenGemiddelde(
                    score
                );


            if (
                gemiddelde === null
            ) {

                return;

            }


            gegevens.push({

                datum:
                    datum,

                gemiddelde:
                    gemiddelde

            });

        }
    );



    if (
        gegevens.length === 0
    ) {

        status.innerText =
            "Nog geen scores beschikbaar voor Gary.";

        return;

    }


    status.innerText =
        "Live gegevens uit Supabase";


    maakGrafiek(
        gegevens
    );

}



// ==================================================
// TESTGEGEVENS
// ==================================================

function laadTestgegevens() {

    const testScores = [

        {
            speeldatum: "2026-09-04",
            game1: 185,
            game2: 192,
            game3: 201
        },

        {
            speeldatum: "2026-09-11",
            game1: 198,
            game2: 205,
            game3: 190
        },

        {
            speeldatum: "2026-09-18",
            game1: 210,
            game2: 202,
            game3: 195
        },

        {
            speeldatum: "2026-09-25",
            game1: 188,
            game2: 194,
            game3: 199
        },

        {
            speeldatum: "2026-10-02",
            game1: 215,
            game2: 208,
            game3: 220
        }

    ];


    const gegevens =
        testScores.map(
            score => ({

                datum:
                    score.speeldatum,

                gemiddelde:
                    berekenGemiddelde(
                        score
                    )

            })
        );


    document.getElementById(
        "status"
    ).innerText =
        "TESTMODUS – voorbeeldscores";


    maakGrafiek(
        gegevens
    );

}



// ==================================================
// GRAFIEK MAKEN
// ==================================================

function maakGrafiek(
    gegevens
) {


    const labels =
        gegevens.map(
            item =>
                toonDatum(
                    item.datum
                )
        );


    const waarden =
        gegevens.map(
            item =>
                item.gemiddelde
        );


    const canvas =
        document.getElementById(
            "grafiek"
        );


    new Chart(
        canvas,
        {

            type: "line",


            data: {

                labels:
                    labels,


                datasets: [

                    {

                        label:
                            "Gemiddelde",

                        data:
                            waarden,

                        tension:
                            0.25,

                        fill:
                            false,

                        borderWidth:
                            3,

                        pointRadius:
                            6,

                        pointHoverRadius:
                            8

                    }

                ]

            },


            options: {

                responsive:
                    true,

                maintainAspectRatio:
                    false,


                layout: {

                    padding: {

                        top: 25,

                        right: 15,

                        left: 10,

                        bottom: 10

                    }

                },


                plugins: {

                    legend: {

                        display:
                            false

                    },


                    tooltip: {

                        callbacks: {

                            label:
                                function(
                                    context
                                ) {

                                    return (

                                        "Gemiddelde: " +

                                        Number(
                                            context.parsed.y
                                        ).toFixed(2)

                                    );

                                }

                        }

                    }

                },


                scales: {

                    x: {

                        title: {

                            display:
                                true,

                            text:
                                "Speeldatum"

                        }

                    },


                    y: {

                        title: {

                            display:
                                true,

                            text:
                                "Gemiddelde"

                        },

                        beginAtZero:
                            false

                    }

                }

            },


            plugins: [

                {

                    id:
                        "gemiddeldeLabels",


                    afterDatasetsDraw:
                        function(
                            chart
                        ) {


                            const ctx =
                                chart.ctx;


                            const meta =
                                chart.getDatasetMeta(
                                    0
                                );


                            const dataset =
                                chart.data.datasets[0];


                            ctx.save();


                            ctx.font =
                                "bold 12px Arial";


                            ctx.textAlign =
                                "center";


                            ctx.textBaseline =
                                "bottom";


                            meta.data.forEach(

                                (
                                    point,
                                    index
                                ) => {


                                    const waarde =
                                        dataset.data[
                                            index
                                        ];


                                    ctx.fillText(

                                        Number(
                                            waarde
                                        ).toFixed(2),

                                        point.x,

                                        point.y - 12

                                    );

                                }

                            );


                            ctx.restore();

                        }

                }

            ]

        }

    );

}



// ==================================================
// START
// ==================================================

if (TESTMODUS) {

    laadTestgegevens();

} else {

    laadSupabaseScores();

}


</script>


</body>

</html>
```
