<style>
:root { --bg:#f4f6f8; --card:#fff; --text:#222; --muted:#666; --border:#ddd; --green:#168a3b; --red:#d52b2b; --orange:#d97900; }
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; transition:.2s; }
.container { max-width:850px; margin:auto; }
h1 { text-align:center; margin:10px 0 4px; }
.subtitle { text-align:center; color:var(--muted); margin-bottom:20px; }
.theme-btn { position:fixed; top:14px; right:14px; border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:20px; padding:8px 13px; cursor:pointer; font-weight:bold; box-shadow:0 2px 6px rgba(0,0,0,.12); }
.datum { margin-top:22px; font-size:19px; font-weight:bold; padding:10px 12px; border-radius:9px; background:var(--card); border-left:5px solid #777; }
.match { margin-top:9px; padding:13px 15px; background:var(--card); border-radius:9px; box-shadow:0 2px 6px rgba(0,0,0,.08); display:grid; grid-template-columns:1fr auto 1fr auto; align-items:center; gap:12px; }
.team { font-weight:bold; }
.team.right { text-align:right; }
.score { text-align:center; font-size:18px; font-weight:bold; white-space:nowrap; }
.diff { min-width:90px; text-align:right; font-size:19px; font-weight:800; }
.win { color:var(--green); } .loss { color:var(--red); } .tie { color:var(--orange); }
.kegels { grid-column:1 / -1; display:grid; grid-template-columns:1fr auto 1fr; color:var(--muted); font-size:14px; margin-top:-4px; }
.kegels .right { text-align:right; }
.loading,.error { text-align:center; padding:25px; } .error {color:var(--red);}
@media(max-width:650px) { body{padding:10px;} .match{grid-template-columns:1fr auto auto;} .team.right{grid-column:1;grid-row:2;text-align:left;} .score{grid-column:2;grid-row:1 / span 2;} .diff{grid-column:3;grid-row:1 / span 2; min-width:70px;} .kegels{grid-column:1 / -1;grid-row:3;} }
body.dark { --bg:#12161b; --card:#1c2229; --text:#f1f1f1; --muted:#aeb6bf; --border:#39414a; --green:#42d879; --red:#ff6262; --orange:#ffb347; }
body.dark .theme-btn { box-shadow:none; }

function datumNL(d) { return new Date(d+'T00:00:00').toLocaleDateString('nl-BE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
async function laad() {
 const {data,error}=await supabaseClient.from('interteam_scores').select('*').order('speeldatum',{ascending:true});
 const el=document.getElementById('lijst');
 if(error){el.innerHTML=`<div class="error">Fout bij het laden: ${error.message}</div>`;return;}
 const scores=data||[];
 const scoreMap=new Map(scores.map(r=>[`${r.speeldatum}|${r.ploeg}`,r]));
 let out=''; let count=0;
 for(const datum of Object.keys(WEDSTRIJDEN)) {
   const matches=WEDSTRIJDEN[datum].filter(([t,u])=>t===RNB||u===RNB);
   const played=matches.filter(([t,u])=>scoreMap.has(`${datum}|${t}`)&&scoreMap.has(`${datum}|${u}`));
   if(!played.length) continue;
   out+=`<div class="datum">Speeldatum: ${datumNL(datum)}</div>`;
   for(const [thuis,uit] of played) {
     const a=scoreMap.get(`${datum}|${thuis}`), b=scoreMap.get(`${datum}|${uit}`);
     const rnbIsThuis=thuis===RNB;
     const rnbK=Number(rnbIsThuis?a.kegels:b.kegels), tegenK=Number(rnbIsThuis?b.kegels:a.kegels);
     const rnbP=Number(rnbIsThuis?a.punten:b.punten), tegenP=Number(rnbIsThuis?b.punten:a.punten);
     const diff=rnbK-tegenK; const cls=diff>0?'win':diff<0?'loss':'tie'; const sign=diff>0?'+':'';
     out+=`<div class="match"><div class="team">${thuis}</div><div class="score">${a.punten} - ${b.punten}</div><div class="team right">${uit}</div><div class="diff ${cls}">${sign}${diff} kegels</div><div class="kegels"><div>${a.kegels} kegels</div><div></div><div class="right">${b.kegels} kegels</div></div></div>`;
     count++;
   }
 }
 el.innerHTML=count?out:'<div class="loading">Nog geen gespeelde matchen gevonden.</div>';
}

thema(localStorage.getItem('rollbowl-thema')||'light'); btn.onclick=()=>thema(document.body.classList.contains('dark')?'light':'dark');
