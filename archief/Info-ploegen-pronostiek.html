<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info ploegen pronostiek</title>
<style>
:root{--bg:#f3f3f3;--card:#fff;--text:#222;--muted:#666;--border:#ddd;--header:#222}
body.dark{--bg:#171717;--card:#242424;--text:#fff;--muted:#ccc;--border:#505050;--header:#000}
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:950px;margin:auto}
.topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:15px}
button{border:1px solid var(--border);border-radius:9px;padding:10px 15px;background:var(--card);color:var(--text);cursor:pointer;font-size:15px}
h1{text-align:center;margin:10px 0 8px}
.subtitel{text-align:center;color:var(--muted);margin-bottom:25px}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.12)}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;border-bottom:1px solid var(--border)}
th{background:var(--header);color:#fff;text-align:center}
th:nth-child(2),td:nth-child(2){text-align:left}
td{text-align:center}
tr:last-child td{border-bottom:none}
.categorie{font-weight:bold;letter-spacing:2px}
tr.rnb td{font-weight:bold}
tr.rnb td:nth-child(2){background:#ffd700;color:#000}
.status{text-align:center;margin:15px 0;color:var(--muted)}
@media(max-width:650px){body{padding:10px}th,td{padding:9px 6px;font-size:13px}th:nth-child(5),td:nth-child(5){display:none}}
@media print{
@page{size:A4 portrait;margin:12mm}
body{background:#fff!important;color:#000!important;padding:0}
.topbar{display:none}.card{box-shadow:none;border:1px solid #bbb}
th{background:#222!important;color:#fff!important}
td{color:#000!important}
tr.rnb td:nth-child(2){background:#ffd700!important;color:#000!important}
}
</style>
</head>
<body>
<div class="container">
<div class="topbar">
<button id="printBtn">🖨️ Printversie</button>
<button id="themeBtn">🌙 Donkere modus</button>
</div>
<h1>🎳 Info ploegen pronostiek</h1>
<div class="subtitel" id="subtitel">Huidig klassement wordt geladen...</div>
<div class="status" id="status"></div>
<div class="card">
<table>
<thead><tr><th>Plaats</th><th>Ploeg</th><th>Spelers cat</th><th>Punten</th><th>Kegels</th><th>Gemiddelde</th></tr></thead>
<tbody id="lijst"></tbody>
</table>
</div>
</div>
<script>
const SUPABASE_URL="https://wnsvbtskynkewxggmjem.supabase.co";
const SUPABASE_KEY="sb_publishable_9d-2CTihH00Q9gUzLYI6lA_13GHTmCx";
const THEME_KEY="rollbowl-info-ploegen-thema";

async function laadGegevens(){
 const status=document.getElementById("status"), lijst=document.getElementById("lijst");
 try{
  const headers={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY};
  const tr=await fetch(SUPABASE_URL+"/rest/v1/teams?select=naam,categorie",{headers});
  if(!tr.ok) throw new Error("Fout bij laden van teams: "+tr.status);
  const teams=await tr.json();
  const sr=await fetch(SUPABASE_URL+"/rest/v1/interteam_scores?select=speeldatum,ploeg,kegels,punten",{headers});
  if(!sr.ok) throw new Error("Fout bij laden van scores: "+sr.status);
  const scores=await sr.json();
  if(!scores.length){status.textContent="Nog geen klassement beschikbaar.";return;}

  const klassement={};
  scores.forEach(s=>{
   if(!s.ploeg)return;
   if(!klassement[s.ploeg]) klassement[s.ploeg]={ploeg:s.ploeg,punten:0,kegels:0,datums:new Set()};
   klassement[s.ploeg].punten+=Number(s.punten)||0;
   klassement[s.ploeg].kegels+=Number(s.kegels)||0;
   klassement[s.ploeg].datums.add(s.speeldatum);
  });

  const data=Object.values(klassement);
  data.sort((a,b)=>b.punten-a.punten || b.kegels-a.kegels || a.ploeg.localeCompare(b.ploeg,"nl"));

  const teamMap={};
  teams.forEach(t=>{if(t.naam)teamMap[t.naam]=t});

  const datums=scores.map(s=>s.speeldatum).filter(Boolean).sort();
  const laatste=datums[datums.length-1];
  document.getElementById("subtitel").textContent="Huidig klassement na "+new Date(laatste+"T12:00:00").toLocaleDateString("nl-BE");

  lijst.innerHTML="";
  data.forEach((item,i)=>{
   const team=teamMap[item.ploeg]||{};
   const cat=team.categorie||"-";
   const gem=item.datums.size?(item.kegels/(item.datums.size*15)).toFixed(1):"0.0";
   const tr=document.createElement("tr");
   if(item.ploeg==="RNB Geenens Construct-Vapor")tr.classList.add("rnb");
   tr.innerHTML=`<td>${i+1}</td><td>${escapeHtml(item.ploeg)}</td><td class="categorie">${escapeHtml(cat)}</td><td>${item.punten}</td><td>${item.kegels}</td><td>${gem}</td>`;
   lijst.appendChild(tr);
  });
  status.textContent="";
 }catch(e){console.error(e);status.textContent="⚠️ "+e.message;}
}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function applyTheme(t){document.body.classList.toggle("dark",t==="donker");document.getElementById("themeBtn").textContent=t==="donker"?"☀️ Lichte modus":"🌙 Donkere modus"}
let theme=localStorage.getItem(THEME_KEY)||"donker";applyTheme(theme);
document.getElementById("themeBtn").onclick=()=>{theme=document.body.classList.contains("dark")?"licht":"donker";localStorage.setItem(THEME_KEY,theme);applyTheme(theme)};
document.getElementById("printBtn").onclick=()=>window.print();
laadGegevens();
</script>
</body>
</html>
