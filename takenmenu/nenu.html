
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bowling update-taken</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 25px 20px 40px;
}

h1 {
    text-align: center;
    margin: 0 0 8px;
    font-size: 28px;
}

.subtitel {
    text-align: center;
    color: #999;
    margin-bottom: 30px;
}


/* TAKEN */

.taken {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.taak {
    display: grid;
    grid-template-columns: 50px 1fr 110px;
    gap: 12px;
    align-items: center;

    background: #1d1d1d;
    border: 1px solid #333;
    border-radius: 10px;

    padding: 14px;
}

.nummer {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    color: #aaa;
}

.titel {
    font-size: 16px;
    font-weight: bold;
}

.bestand {
    color: #777;
    font-size: 12px;
    margin-top: 4px;
}

.open-knop {
    padding: 10px 12px;

    border: none;
    border-radius: 7px;

    background: #245c38;
    color: white;

    font-size: 14px;
    cursor: pointer;
}

.open-knop:hover {
    background: #2e7548;
}


/* INFO */

.info {
    background: #191919;
    border: 1px solid #333;
    border-radius: 10px;

    padding: 15px;
    margin-top: 25px;

    color: #999;
    font-size: 13px;
    line-height: 1.5;
}


@media (max-width: 600px) {

    .taak {
        grid-template-columns: 40px 1fr;
    }

    .open-knop {
        grid-column: 2;
        width: 120px;
    }

}

</style>
</head>


<body>

<div class="container">

    <h1>🎳 Bowling update taken</h1>

    <div class="subtitel">
        Snelkoppelingen naar mijn bowlingbestanden
    </div>


    <div class="taken" id="taken"></div>


    <div class="info">

        <strong>Bestanden:</strong><br><br>

        Alle lokale HTML-bestanden staan in dezelfde map als
        <strong>menu.html</strong>.

        <br><br>

        Wil je een titel of bestand wijzigen?
        Pas dan bovenaan in de HTML-code de lijst
        <strong>taken</strong> aan.

    </div>

</div>


<script>

/* ==================================================
   HIER KAN JE ZELF DE 10 TITELS EN BESTANDSNAMEN
   INVULLEN
   ================================================== */

const taken = [

    {
        titel: "Spelers-scores invullen + volgorde",
        bestand: "./Input spelers met volgorde.html"
    },

    {
        titel: "Interteam-scores invullen",
        bestand: "./Input scores interteam.html"
    },

    {
        titel: "Scorebladen en klassementen downloaden (inloggen)",
        bestand: "https://mybowling.bbsf.be/"
    },

    {
        titel: "PDF-docs uploaden naar Dropbox",
        bestand: "https://www.dropbox.com/home/Scorebladen?di=left_nav_browse"
    },

    {
        titel: "PDF-docs uploaden naar Supabase en Url plakken",
        bestand: "https://supabase.com/dashboard/project/wnsvbtskynkewxggmjem/storage/files/buckets/PDF?path=Klassementen"
    },

    {
        titel: "Pronostiek invullen",
        bestand: "./Invoer pronostiek.html"
    },

    {
        titel: "Belangrijke mededeling",
        bestand: "./Mededeling.html"
    },

    {
        titel: "Punten calculator",
        bestand: "./Punten calculator.html"
    },

    {
        titel: "Tellerbeheer + reset",
        bestand: "./Tellerbeheer.html"
    },

    {
        titel: "Kalender",
        bestand: "./Division-3A.pdf"
    },

  {
        titel: "Topspeler tegenploeg invullen",
        bestand: "./Topspeler-tegenploeg-invoer.html"
    },

  {
        titel: "Inhaalmatch invullen",
        bestand: "https://supabase.com/dashboard/project/wnsvbtskynkewxggmjem/editor/17785?schema=public"
    },

  {
        titel: "Info menu spelers",
        bestand: "./rollbowl-klassement.html"
    },

  {
        titel: "Info algemeen klassement",
        bestand: "./interteam-klassement.html"
    },

 {
        titel: "Mijn website",
        bestand: "https://potietje-lab.github.io/interteam-klassementen/Welkom.html?utm_source=chatgpt.com"
    },


  {
        titel: "Github",
        bestand: "https://github.com/"
    },

  {
        titel: "Weekoverzicht mailen",
        bestand: "./Weekoverzicht versturen.html"
    },

  {
        titel: "Topserie interteamspelers (opgeslagen in browser)",
        bestand: "./Topserie interteamspelers.html"
    }

];


/* ==================================================
   MENU MAKEN
   ================================================== */

const container =
    document.getElementById("taken");


taken.forEach((taak, index) => {

    const rij =
        document.createElement("div");

    rij.className = "taak";


    rij.innerHTML = `

        <div class="nummer">
            ${index + 1}
        </div>

        <div>

            <div class="titel">
                ${taak.titel}
            </div>

            <div class="bestand">
                ${taak.bestand}
            </div>

        </div>

        <button
            class="open-knop"
            onclick="openBestand('${taak.bestand}')"
        >
            ▶ Openen
        </button>

    `;


    container.appendChild(rij);

});


/* ==================================================
   BESTAND OPENEN
   ================================================== */

function openBestand(bestand) {

    window.open(
        bestand,
        "_blank"
    );

}

</script>

</body>
</html>
```
