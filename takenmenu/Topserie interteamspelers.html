<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roll & Bowl - Spelers per ploeg</title>
<style>
:root{
  --bg:#f3f3f3;
  --card:#fff;
  --text:#222;
  --muted:#666;
  --border:#ddd;
  --header:#222;
  --headerText:#fff;
  --cat:#e9e9e9;
}
body.dark{
  --bg:#171717;
  --card:#242424;
  --text:#fff;
  --muted:#ccc;
  --border:#505050;
  --header:#000;
  --headerText:#fff;
  --cat:#353535;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{
  max-width:850px;
  margin:auto;
}
.topbar{
  display:flex;
  justify-content:flex-end;
  margin-bottom:15px;
}
button{
  border:1px solid var(--border);
  border-radius:9px;
  padding:10px 15px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  font-size:15px;
}
h1{
  text-align:center;
  margin:10px 0 25px;
}
.team{
  background:var(--card);
  border-radius:14px;
  margin-bottom:20px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}
.team-title{
  background:var(--header);
  color:var(--headerText);
  padding:14px 18px;
  font-size:20px;
  font-weight:bold;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px 15px;
  border-bottom:1px solid var(--border);
}
th{
  text-align:left;
  color:var(--muted);
  font-size:13px;
  text-transform:uppercase;
}
td:first-child{
  width:130px;
  font-weight:bold;
}
tr:last-child td{
  border-bottom:none;
}
.cat-A{font-weight:bold;color:#d32f2f}
.cat-B{font-weight:bold;color:#198754}
.cat-C{font-weight:bold}
.cat-D{font-weight:bold}
.cat-unknown{font-weight:bold}

@media print{
  @page{size:A4 portrait;margin:12mm}
  body{
    background:#fff !important;
    color:#000 !important;
    padding:0;
    font-size:12px;
  }
  .topbar{display:none !important}
  h1{font-size:22px;margin:0 0 15px}
  .container{max-width:none}
  .team{
    box-shadow:none;
    border:1px solid #bbb;
    margin-bottom:12px;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  .team-title{
    background:#222 !important;
    color:#fff !important;
    padding:8px 12px;
    font-size:15px;
  }

  .rnb-title{
    background:#ffd700 !important;
    color:#000 !important;
  }

  th,td{
    padding:5px 10px;
    color:#000;
    border-bottom:1px solid #ccc;
  }
  th{font-size:11px}
  .cat-A{color:#d32f2f !important}
  .cat-B{color:#198754 !important}
  .cat-C,.cat-D,.cat-unknown{color:#000 !important}
}

@media(max-width:600px){
  body{padding:10px}
  .team-title{font-size:18px}
  th,td{padding:9px 10px}
}

.rnb-title{
  background:#ffd700 !important;
  color:#000 !important;
}


.topserie-box{
  background:var(--card);
  border-radius:14px;
  padding:15px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}
.topserie-row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}
.topserie-row select,
.topserie-row input{
  padding:10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-size:15px;
}
.topserie-row select{
  flex:1;
  min-width:240px;
}
.topserie-row input{
  width:120px;
}
#topserieStatus{
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}
.saved-section{
  margin-top:25px;
  background:var(--card);
  border-radius:14px;
  padding:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}
.saved-section h2{
  text-align:center;
  margin:0 0 15px;
}
.saved-table{
  width:100%;
  border-collapse:collapse;
}
.saved-table th,.saved-table td{
  padding:9px 12px;
  border-bottom:1px solid var(--border);
}
.saved-table th{
  text-align:left;
  color:var(--muted);
  font-size:13px;
  text-transform:uppercase;
}
.saved-table td:last-child,
.saved-table th:last-child{
  text-align:center;
}
.topserie-value{
  font-weight:bold;
  margin-left:8px;
  color:#198754;
}
.saved-empty{
  text-align:center;
  color:var(--muted);
}
@media print{
  .topserie-box{display:none !important}
  .saved-section{
    box-shadow:none;
    border:1px solid #bbb;
  }
}

</style>
</head>
<body>
<div class="container">

<div class="topbar">
  <button id="printBtn">🖨️ Printversie</button>
  <button id="themeBtn">🌙 Donkere modus</button>
</div>

<h1>🎳 Spelers per ploeg</h1>

<div class="topserie-box">
  <div class="topserie-row">
    <select id="spelerSelect">
      <option value="">-- Kies een speler --</option>
    </select>
    <input id="topserieInput" type="number" min="0" max="900" step="1"
           placeholder="Topserie">
    <button id="addTopserieBtn">➕ Toevoegen</button>
    <button id="saveTopserieBtn">💾 Opslaan</button>
  </div>
  <div id="topserieStatus"></div>
</div>
<div id="lijst"></div>

<div class="saved-section">
  <h2>📋 Topseries</h2>
  <div id="savedList">
    <p class="saved-empty">Nog geen topseries ingevuld.</p>
  </div>
</div>

</div>

<script>
const spelers = [

  ]],

  ]],
  ["DCG Yok Tha",[

  ]],
  ["FLP ALLCORE IT",[

    ["??","Leila Vanoplynes"]
  ]],
  ["FLP Argenta Hamme",[

    ["C","José Hillaert"],
    ["D","Ben Tosseyn"],

  ]],
  ["LAT Esento",[

    ["C","Luc Van den Haute"],

  ]],
  ["Oilsjt 2 Yok Tha",[
    ["B","Ruben Staelens"],

    ["D","Hans De Wilde"],
    ["D","Jeroen Ghijselinck"],

  ["Royal Ghent 3",[

  ]],
  ["Stene - Pleisterwerken Delrue JP",[
    ["A","Martin Deceuninck"],
    ["B","Yannick Rys"],
    ["C","Dirk Meeze"],
    ["C","Marc Rammelaere"],
    ["C","Mathias Verminck"],
    ["D","Kenny Cauwels"]
  ]],
  ["TSZ Bieshoop",[
    ["A","Robby Derijck"],
    ["B","Jelle Praet"],
    ["C","Ivo Van De Wiele"],
    ["C","Po Lung Lee"],
    ["D","Sylvie Verpaele"]
  ]],
  ["Wuitens",[
    ["B","Stefan Verrooten"],
    ["C","Wery Willaert"],
    ["D","Bart Piessens"],

    ["D","Frederic Piessens"],
    ["D","Kif Willaert"]
  ]]
];

const volgorde = {"A":1,"B":2,"C":3,"D":4,"??":5};

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function bouwLijst(){
  const container=document.getElementById("lijst");
  container.innerHTML="";

  spelers.forEach(([ploeg,lijst])=>{
    const gesorteerd=[...lijst].sort((a,b)=>{
      const verschil=volgorde[a[0]]-volgorde[b[0]];
      if(verschil!==0) return verschil;
      return a[1].localeCompare(b[1],"nl");
    });

    const div=document.createElement("div");
    div.className="team";

    let html=`<div class="team-title${ploeg==="RNB Geenens Construct-Vapor" ? " rnb-title" : ""}">${escapeHtml(ploeg)}</div>
      <table>
      <thead><tr><th>Categorie</th><th>Naam</th></tr></thead><tbody>`;

    gesorteerd.forEach(([cat,naam])=>{
      const cls=cat==="??" ? "cat-unknown" : "cat-"+cat;
      html+=`<tr>
      <td class="${cls}">${escapeHtml(cat)}</td>
      <td>${escapeHtml(naam)} <span class="topserie-value" data-player="${escapeHtml(naam)}"></span></td>
    </tr>`;
    });

    html+=`</tbody></table>`;
    div.innerHTML=html;
    container.appendChild(div);
  });
}


const TOPSERIE_KEY = "rollbowl-topseries";
const THEME_KEY = "rollbowl-spelers-thema";

function alleSpelers(){
  const lijst = [];
  spelers.forEach(([ploeg, namen])=>{
    namen.forEach(([cat, naam])=>{
      lijst.push({naam, ploeg});
    });
  });
  return lijst.sort((a,b)=>a.naam.localeCompare(b.naam,"nl"));
}

function vulDropdown(){
  const select = document.getElementById("spelerSelect");
  alleSpelers().forEach(speler=>{
    const option = document.createElement("option");
    option.value = speler.naam;
    option.textContent = speler.naam + " — " + speler.ploeg;
    select.appendChild(option);
  });
}

function laadGegevens(){
  try{
    return JSON.parse(localStorage.getItem(TOPSERIE_KEY) || "{}");
  }catch(e){
    return {};
  }
}

function toonTopseries(gegevens){
  document.querySelectorAll(".topserie-value").forEach(span=>{
    const naam = span.dataset.player;
    span.textContent = gegevens[naam] !== undefined
      ? " (" + gegevens[naam] + ")"
      : "";
  });

  const container = document.getElementById("savedList");
  const namen = Object.keys(gegevens).sort((a,b)=>a.localeCompare(b,"nl"));

  if(!namen.length){
    container.innerHTML =
      '<p class="saved-empty">Nog geen topseries ingevuld.</p>';
    return;
  }

  let tabel = `<table class="saved-table">
    <thead><tr><th>Naam</th><th>Ploeg</th><th>Topserie</th></tr></thead><tbody>`;

  const spelerInfo = {};
  alleSpelers().forEach(s=>spelerInfo[s.naam]=s.ploeg);

  namen.forEach(naam=>{
    tabel += `<tr>
      <td>${escapeHtml(naam)}</td>
      <td>${escapeHtml(spelerInfo[naam] || "")}</td>
      <td><strong>${escapeHtml(gegevens[naam])}</strong></td>
    </tr>`;
  });

  tabel += "</tbody></table>";
  container.innerHTML = tabel;
}

function voegTopserieToe(){
  const select = document.getElementById("spelerSelect");
  const input = document.getElementById("topserieInput");
  const status = document.getElementById("topserieStatus");

  const naam = select.value;
  const waarde = input.value.trim();

  if(!naam){
    status.textContent = "⚠️ Kies eerst een speler.";
    return;
  }

  if(!waarde || Number(waarde) < 0 || Number(waarde) > 900){
    status.textContent = "⚠️ Vul een topserie in tussen 0 en 900.";
    return;
  }

  const gegevens = laadGegevens();
  gegevens[naam] = waarde;
  localStorage.setItem(TOPSERIE_KEY, JSON.stringify(gegevens));

  toonTopseries(gegevens);
  status.textContent = "✅ " + naam + " — topserie " + waarde + " toegevoegd.";

  select.value = "";
  input.value = "";
}

function opslaanTopseries(){
  const gegevens = laadGegevens();
  localStorage.setItem(TOPSERIE_KEY, JSON.stringify(gegevens));
  toonTopseries(gegevens);

  const status = document.getElementById("topserieStatus");
  status.textContent = "✅ De topseries zijn opgeslagen.";

  const btn = document.getElementById("saveTopserieBtn");
  btn.textContent = "✅ Opgeslagen";
  setTimeout(()=>btn.textContent="💾 Opslaan",1500);
}

function applyTheme(theme){
  document.body.classList.toggle("dark",theme==="donker");
  document.getElementById("themeBtn").textContent =
    theme==="donker" ? "☀️ Lichte modus" : "🌙 Donkere modus";
}

let theme=localStorage.getItem(THEME_KEY) || "donker";
applyTheme(theme);

document.getElementById("printBtn").addEventListener("click",()=>{
  window.print();
});

document.getElementById("themeBtn").addEventListener("click",()=>{
  theme=document.body.classList.contains("dark") ? "licht" : "donker";
  localStorage.setItem(THEME_KEY,theme);
  applyTheme(theme);
});

document.getElementById("addTopserieBtn").addEventListener("click",voegTopserieToe);
document.getElementById("saveTopserieBtn").addEventListener("click",opslaanTopseries);

bouwLijst();
vulDropdown();
toonTopseries(laadGegevens());

</script>
</body>
</html>
