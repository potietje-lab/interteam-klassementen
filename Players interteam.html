<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Officieel info Bowling Vlaanderen – Spelerslijst</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--panel2:#18263d;--line:#2b3b55;--text:#edf3fb;--muted:#aab9cc;--accent:#f5b82e;--green:#45d483;--blue:#68b7ff}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#08101d,#111d30 60%,#0b1220);color:var(--text);font:15px/1.45 Arial,Helvetica,sans-serif}
header{padding:28px 18px 20px;text-align:center;border-bottom:1px solid var(--line);background:#0a1322}
h1{margin:0;font-size:clamp(25px,4vw,38px);letter-spacing:.4px}
h1 span{color:var(--accent)}
.subtitle{margin:7px 0 0;color:var(--muted)}
main{max-width:1250px;margin:22px auto;padding:0 14px 36px}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:145px;flex:1}
.stat .number{display:block;color:var(--accent);font-size:25px;font-weight:800}
.stat .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.controls{display:grid;grid-template-columns:minmax(190px,1.6fr) minmax(170px,1fr) auto auto;gap:10px;background:var(--panel);padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:15px}
input,select,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:11px 12px;background:#0b1525;color:var(--text);min-width:0}
input::placeholder{color:#8293aa}
button{cursor:pointer;font-weight:700;background:var(--accent);color:#17202d;border-color:var(--accent)}
button.secondary{background:var(--panel2);color:var(--text);border-color:var(--line)}
button:hover{filter:brightness(1.08)}
.info{color:var(--muted);font-size:13px;margin:10px 2px 13px}
.team-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 2px 9px}
.team-heading h2{font-size:18px;margin:0}
.team-heading span{font-size:12px;color:var(--muted);background:var(--panel2);padding:4px 9px;border-radius:20px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:rgba(18,29,48,.9)}
table{border-collapse:collapse;width:100%;min-width:650px}
thead{background:#1a2a42}
th{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:#b9c8da;text-align:left;padding:12px 14px;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid rgba(43,59,85,.72)}
tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
tbody tr:hover{background:rgba(104,183,255,.08)}
td:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.player{font-weight:700}
.cat{display:inline-block;min-width:34px;text-align:center;padding:3px 7px;border-radius:6px;font-size:12px;font-weight:800;background:#263750}
.cat-a,.cat-ap{background:#5b4220;color:#ffdb78}
.cat-b{background:#173d5d;color:#8dd0ff}
.cat-c{background:#244331;color:#8ce5ad}
.cat-d,.cat-dp{background:#3b2b4c;color:#dfb6ff}
.avg{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.avg.high{color:var(--green)}
.avg.missing{color:#74849a;font-weight:400}
.empty{padding:24px;text-align:center;color:var(--muted)}
footer{text-align:center;color:#71839b;font-size:12px;padding:18px}
@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.stat{min-width:calc(50% - 8px)}}
@media(max-width:430px){.controls{grid-template-columns:1fr}.controls input{grid-column:auto}.stat{min-width:100%}main{padding:0 9px 25px}}
@media print{body{background:#fff;color:#111}header{background:#fff;color:#111;border-color:#bbb}.subtitle,.info,footer{color:#555}.stat,.controls,.table-wrap{background:#fff;border-color:#bbb}.stat .number{color:#111}input,select,button{display:none}thead{background:#eee}th{color:#111}td{border-color:#ddd}tbody tr:nth-child(even){background:#f7f7f7}.cat{background:#eee!important;color:#111!important}}
</style>
</head>
<body>

    <div class="stat"><span class="number" id="topAverage">—</span><span class="label">Hoogste gemiddelde</span></div>
  </section>
  <section class="controls" aria-label="Zoeken en filteren">
    <input id="search" type="search" placeholder="Zoek op naam, licentie of team…" aria-label="Zoeken">
    <select id="teamFilter" aria-label="Filter op team"><option value="">Alle teams</option></select>
    <select id="sort" aria-label="Sorteren">
      <option value="team-asc">Team: A–Z</option>
      <option value="team-desc">Team: Z–A</option>
      <option value="license-asc">Licentie: laag naar hoog</option>
      <option value="license-desc">Licentie: hoog naar laag</option>
      <option value="name-asc">Naam: A–Z</option>
      <option value="name-desc">Naam: Z–A</option>
      <option value="cat-asc">Categorie: A–Z</option>
      <option value="cat-desc">Categorie: Z–A</option>
      <option value="avg-desc">Gemiddelde: hoog naar laag</option>
      <option value="avg-asc">Gemiddelde: laag naar hoog</option>
    </select>
    <button class="secondary" onclick="window.print()">Afdrukken</button>
  </section>
  <p class="info" id="resultInfo" aria-live="polite"></p>
  <div id="tables"></div>
</main>
<footer>Roll &amp; Bowl · Spelersoverzicht</footer>

const $ = id => document.getElementById(id);
const teamNames = [...new Set(players.map(p=>p[4]))].sort((a,b)=>a.localeCompare(b,'nl'));
teamNames.forEach(team=>{const o=document.createElement('option');o.value=team;o.textContent=team;$('teamFilter').appendChild(o)});
$('playerCount').textContent=players.length;
$('teamCount').textContent=teamNames.length;
$('topAverage').textContent=Math.max(...players.filter(p=>p[3]!==null).map(p=>p[3]));
function catClass(cat){return 'cat-'+cat.toLowerCase().replace('+','p')}
function render(){
 const q=$('search').value.trim().toLocaleLowerCase('nl');
 const selectedTeam=$('teamFilter').value;
 const sort=$('sort').value;
 let rows=players.filter(p=>(!selectedTeam||p[4]===selectedTeam)&&p.join(' ').toLocaleLowerCase('nl').includes(q));
 const cmp=(a,b)=>a.localeCompare(b,'nl',{numeric:true,sensitivity:'base'});
 rows.sort((a,b)=>{
  switch(sort){
   case 'team-asc': return cmp(a[4],b[4])||cmp(a[1],b[1]);
   case 'team-desc': return cmp(b[4],a[4])||cmp(a[1],b[1]);
   case 'license-asc': return Number(a[0])-Number(b[0]);
   case 'license-desc': return Number(b[0])-Number(a[0]);
   case 'name-asc': return cmp(a[1],b[1]);
   case 'name-desc': return cmp(b[1],a[1]);
   case 'cat-asc': return cmp(a[2],b[2])||cmp(a[1],b[1]);
   case 'cat-desc': return cmp(b[2],a[2])||cmp(a[1],b[1]);
   case 'avg-desc': return (b[3]??-1)-(a[3]??-1)||cmp(a[1],b[1]);
   case 'avg-asc': return (a[3]??999)-(b[3]??999)||cmp(a[1],b[1]);
   default: return cmp(a[4],b[4])||cmp(a[1],b[1]);
  }
 });
 $('resultInfo').textContent=`${rows.length} van ${players.length} spelers weergegeven`;
 const host=$('tables');host.replaceChildren();
 if(!rows.length){host.innerHTML='<div class="table-wrap empty">Geen spelers gevonden.</div>';return}
 const wrap=document.createElement('div');wrap.className='table-wrap';
 const table=document.createElement('table');
 table.innerHTML='<thead><tr><th>Licentie</th><th>Naam</th><th>Categorie</th><th>Gemiddelde</th><th>Team</th></tr></thead>';
 const body=document.createElement('tbody');
 rows.forEach(p=>{
  const tr=document.createElement('tr');
  const lic=document.createElement('td');lic.textContent=p[0];
  const name=document.createElement('td');name.className='player';name.textContent=p[1];
  const cat=document.createElement('td');const badge=document.createElement('span');badge.className='cat '+catClass(p[2]);badge.textContent=p[2];cat.appendChild(badge);
  const avg=document.createElement('td');avg.className='avg '+(p[3]===null?'missing':p[3]>=190?'high':'');avg.textContent=p[3]===null?'—':p[3];
  const team=document.createElement('td');team.textContent=p[4];
  tr.append(lic,name,cat,avg,team);body.appendChild(tr);
 });
 table.appendChild(body);wrap.appendChild(table);host.appendChild(wrap);
}
$('search').addEventListener('input',render);

render();

</html>
