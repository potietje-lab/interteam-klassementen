<!DOCTYPE html>

<head>

<title>Rollbowl - Top 3 tegenstanders</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:transparent;color:#222}
.container{max-width:900px;margin:auto;background:rgba(255,255,255,.96);padding:25px;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
h1{text-align:center;margin-top:0;font-size:28px}.subtitel{text-align:center;margin-bottom:25px;color:#555}
.kaart{display:flex;align-items:center;gap:14px;padding:14px;margin:10px 0;border:1px solid #ddd;border-radius:12px;background:#fff}
.rang{font-size:24px;font-weight:bold;min-width:32px;text-align:center}
.gegevens{min-width:0;flex:1}.tegenstander{font-size:18px;font-weight:bold;margin-bottom:6px}
.details{line-height:1.6}.scoreblad-link{display:inline-block;margin-top:8px;padding:7px 11px;border-radius:8px;background:#2563eb;color:#fff!important;text-decoration:none;font-weight:bold;font-size:14px}

.status{text-align:center;padding:15px;color:#666}table{width:100%;border-collapse:collapse}
th,td{padding:13px 10px;border-bottom:1px solid #ddd;text-align:center}th{background:#f1f1f1}
td:nth-child(2){text-align:left;font-weight:bold}.plaats{font-size:22px;width:60px}.kegels{font-weight:bold;font-size:18px}
.fout{color:#b00020;text-align:center;padding:20px;font-weight:bold}
@media(max-width:600px){body{padding:8px}.container{padding:15px 8px}h1{font-size:22px}th,td{padding:10px 5px;font-size:14px}.plaats{font-size:18px}.kegels{font-size:16px}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

/* =========================================================
   Roll & Bowl - Donkere / Lichte modus
   ========================================================= */

    position: fixed !important;
    top: 12px !important;
    right: 12px !important;
    z-index: 99999 !important;
    border: 1px solid #777 !important;
    border-radius: 10px !important;
    padding: 9px 13px !important;
    background: #ffffff !important;
    color: #222222 !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    box-shadow: 0 2px 8px rgba(0,0,0,.18) !important;
}

    opacity: .9;
}

body.rb-dark {
    background: #111827 !important;
    color: #e5e7eb !important;
}

/* Algemene lichte vlakken */

body.rb-dark .card,
body.rb-dark .box,
body.rb-dark .panel,
body.rb-dark .section,

}

/* Veel gebruikte neutrale koppen/onderdelen */

/* Tabellen */

}

}

/* Formulieren */
body.rb-dark input,
body.rb-dark select,
body.rb-dark textarea {
    background: #111827 !important;
    color: #f3f4f6 !important;
    border-color: #4b5563 !important;
    color-scheme: dark;

body.rb-dark input::placeholder,
body.rb-dark textarea::placeholder {
    color: #9ca3af !important;
}

/* Neutrale tekstkleuren */
body.rb-dark .subtitle,
body.rb-dark .subtitel,
body.rb-dark .status,
body.rb-dark .muted,
body.rb-dark .small,
body.rb-dark .help,

    color: #cbd5e1 !important;
}

/* Informatie- en meldingsvakken */
body.rb-dark .info-box {
    background: #1e3a5f !important;
    color: #dbeafe !important;
    border-color: #3b82f6 !important;
}
body.rb-dark .warning,
body.rb-dark .warning-box {
    background: #4a3510 !important;
    color: #fde68a !important;
    border-color: #a16207 !important;
}

body.rb-dark .success-box {
    background: #123b2a !important;
    color: #bbf7d0 !important;
}
body.rb-dark .error,
body.rb-dark .error-box {
    background: #4a1d1d !important;
    color: #fecaca !important;
}

/* RNB / automatisch berekende rijen blijven herkenbaar */
body.rb-dark .rnb-row {
    background: #4a3b12 !important;
}

/* Knoppen behouden zoveel mogelijk hun bestaande accentkleur.
   Alleen neutrale knoppen krijgen een donkere achtergrond. */
body.rb-dark button:not(.theme-toggle-rb) {
    border-color: #4b5563;
}
body.rb-dark button.secondary,
body.rb-dark .secondary-button,
body.rb-dark .btn-secondary {
    background: #374151 !important;
    color: #f3f4f6 !important;
}

/* Links */
body.rb-dark a {
    color: #93c5fd;
}

/* Thema-knop in donkere modus */
body.rb-dark .theme-toggle-rb {
    background: #374151 !important;
    color: #f9fafb !important;
    border-color: #6b7280 !important;
}

</style>

<body>
<div class="container">
<h1>🎳 Tegenstanders</h1>
<div class="subtitel">Hoogste aantal kegels in gespeelde wedstrijden</div>
<div id="status" class="status">Gegevens worden geladen...</div>
<div id="lijst"></div>
</div>

<script>
const SUPABASE_URL = "https://wnsvbtskynkewxggmjem.supabase.co";
const SUPABASE_KEY = "sb_publishable_9d-2CTihH00Q9gUzLYI6lA_13GHTmCx";
const RNB = "RNB Geenens Construct-Vapor";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

function norm(v){
  return String(v ?? "")
    .trim()
    .replace(/\s+/g," ")
    .toLowerCase();
}

function formatDatum(d){
  if(!d) return "";
  const p = d.split("-");
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : d;
}

// Publieke PDF's staan in bucket PDF, map Scorebladen.
// Bestandsnamen beginnen met DD-MM-YYYY_, gevolgd door match/ploeggegevens.
// We zoeken de exacte objectnaam in Storage zodat er geen foutieve PDF-link ontstaat.
let scorebladPerDatum = new Map();

function datumPrefix(datum){
  const match = String(datum || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return match ? `${match[3]}-${match[2]}-${match[1]}_` : "";
}

async function laadScorebladen(){
  const { data, error } = await db.storage
    .from("PDF")
    .list("Scorebladen", { limit: 1000, sortBy: { column: "name", order: "asc" } });

  if(error) {
    console.warn("Scorebladen konden niet worden opgelijst:", error.message);
    return;
  }

  scorebladPerDatum = new Map();
  for(const bestand of (data || [])){
    if(!bestand.name || bestand.name.startsWith(".")) continue;
    const match = bestand.name.match(/^(\d{2}-\d{2}-\d{4})_/);
    if(!match) continue;
    const delen = match[1].split("-");
    const isoDatum = `${delen[2]}-${delen[1]}-${delen[0]}`;
    if(!scorebladPerDatum.has(isoDatum)){
      const { data: publicData } = db.storage
        .from("PDF")
        .getPublicUrl(`Scorebladen/${bestand.name}`);
      scorebladPerDatum.set(isoDatum, publicData?.publicUrl || "");
    }
  }
}

function scorebladUrl(datum){
  return scorebladPerDatum.get(String(datum || "").slice(0,10)) || "";
}

// De knop blijft zichtbaar, ook wanneer Storage de bestandslijst niet vooraf toestaat.
// Bij een klik zoeken we opnieuw naar een PDF waarvan de naam met DD-MM-YYYY_ begint.
function normBestandsnaam(waarde){
  return String(waarde || "")
    .normalize("NFD").replace(/[\\u0300-\\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]/g, "");
}

async function openScoreblad(datum, ploeg1, ploeg2, knop){
  const prefix = datumPrefix(datum);
  if(!prefix){
    alert("Voor deze wedstrijd is geen geldige speeldatum beschikbaar.");
    return;
  }
  const origineleTekst = knop ? knop.textContent : "";
  if(knop){ knop.disabled = true; knop.textContent = "PDF zoeken…"; }
  try{
    // Zoek zonder de Storage-parameter "search": die kan resultaten missen.
    // Haal de map in pagina's op en vergelijk daarna de exacte datum-prefix.
    let bestanden = [];
    let offset = 0;
    const paginaGrootte = 100;
    while(true){
      const { data, error } = await db.storage
        .from("PDF")
        .list("Scorebladen", {
          limit: paginaGrootte,
          offset,
          sortBy: { column: "name", order: "asc" }
        });
      if(error){
        console.error("Scoreblad zoeken mislukt:", error);
        alert("Supabase laat de bestandenlijst niet lezen. Controleer de Storage-listrechten voor bucket PDF en map Scorebladen. Details: " + error.message);
        return;
      }
      const pagina = data || [];
      bestanden = bestanden.concat(pagina);
      if(pagina.length < paginaGrootte) break;
      offset += paginaGrootte;
    }
    const naam1 = normBestandsnaam(ploeg1);
    const naam2 = normBestandsnaam(ploeg2);
    const opDatum = bestanden.filter(item => item.name && item.name.startsWith(prefix));
    const bevatPloeg = (bestandsnaam, ploeg) => {
      if(!ploeg) return false;
      const fileNorm = normBestandsnaam(bestandsnaam);
      // Teamnamen kunnen in de PDF-naam aangevuld zijn met sponsornamen.
      return fileNorm.includes(ploeg) ||
        (ploeg.length > 8 && fileNorm.includes(ploeg.slice(0, Math.min(ploeg.length, 14))));
    };
    // Eerst de sterkste match: datum en beide ploegen.
    let bestand = opDatum.find(item =>
      bevatPloeg(item.name, naam1) && bevatPloeg(item.name, naam2)
    );

    // Als de namen in de database anders geschreven zijn dan in de PDF,
    // probeer datum + één van de ploegen. Kies alleen als dit uniek is.
    if(!bestand){
      const matchesEenPloeg = opDatum.filter(item =>
        bevatPloeg(item.name, naam1) || bevatPloeg(item.name, naam2)
      );
      if(matchesEenPloeg.length === 1) bestand = matchesEenPloeg[0];
    }

    // Als er maar één PDF voor die datum bestaat, is die ondubbelzinnig.
    if(!bestand && opDatum.length === 1) bestand = opDatum[0];

    const padScoreblad = bestand ? ("Scorebladen/" + bestand.name) : "";
    if(!padScoreblad){
      const namen = opDatum.map(item => item.name).join("\\n");
      alert("Ik kan het juiste scoreblad voor " + prefix.slice(0,10) +
        " niet eenduidig bepalen op basis van de ploegnamen. PDF's voor deze datum:\\n" +
        (namen || "(geen bestanden gevonden)") +
        "\\nStuur deze lijst door, dan pas ik de koppeling aan.");
      return;
    }
    const { data: publicData } = db.storage.from("PDF").getPublicUrl(padScoreblad);
    if(!publicData?.publicUrl){
      alert("De publieke URL van het scoreblad kon niet worden gemaakt.");
      return;
    }
    window.open(publicData.publicUrl, "_blank", "noopener,noreferrer");
  }catch(err){
    console.error(err);
    alert("Er ging iets mis bij het zoeken naar het scoreblad: " + (err.message || err));
  }finally{
    if(knop){ knop.disabled = false; knop.textContent = origineleTekst || "📄 Scoreblad openen"; }
  }
}

async function laadData(){

  const status = document.getElementById("status");
  const lijst = document.getElementById("lijst");

  try{

    // Scores + team_id ophalen
    const { data: scores, error: scoreError } = await db
      .from("interteam_scores")
      .select("speeldatum, ploeg, kegels, punten, team_id");

    if(scoreError) throw scoreError;

    // Teams ophalen zodat team_id altijd naar de actuele ploegnaam kan worden vertaald
    const { data: teams, error: teamError } = await db
      .from("teams")
      .select("id, naam, actief");

    if(teamError) throw teamError;

    const teamById = new Map(
      (teams || []).map(t => [String(t.id), t.naam])
    );

    function scoreTeamName(s){
      if(s.team_id != null && teamById.has(String(s.team_id))){
        return teamById.get(String(s.team_id));
      }
      return s.ploeg;
    }

    // Alle scores voorzien van één gestandaardiseerde teamnaam
    const scoreRows = (scores || []).map(s => ({
      ...s,
      teamNaam: scoreTeamName(s),
      kegelsNum: Number(s.kegels),
      puntenNum: Number(s.punten) || 0
    }));

    // RNB-ID bepalen
    const rnbTeam = (teams || []).find(t => norm(t.naam) === norm(RNB));
    const rnbId = rnbTeam ? String(rnbTeam.id) : null;

    // RNB scores bepalen via team_id als die beschikbaar is,
    // anders via de ploegnaam.
    const rnbScores = scoreRows.filter(s =>
      (rnbId && s.team_id != null && String(s.team_id) === rnbId) ||
      norm(s.teamNaam) === norm(RNB)
    );

    // Wedstrijden ophalen
    const { data: wedstrijden, error: wedstrijdError } = await db
      .from("wedstrijden")
      .select("id, geplande_datum, werkelijke_datum, thuisploeg, uitploeg, status")
      .order("geplande_datum", { ascending:true });

    if(wedstrijdError) throw wedstrijdError;

    const resultaten = [];
    const unieke = new Set();

    for(const rnbScore of rnbScores){

      const scoreDatum = rnbScore.speeldatum;

      // Zoek wedstrijden waarvan de werkelijke datum gelijk is aan
      // de datum waarop RNB daadwerkelijk een score heeft.
      const kandidaten = (wedstrijden || []).filter(w => {

        const wedstrijdDatum = w.werkelijke_datum || w.geplande_datum;

        if(wedstrijdDatum !== scoreDatum) return false;

        return norm(w.thuisploeg) === norm(RNB) ||
               norm(w.uitploeg) === norm(RNB);
      });

      for(const w of kandidaten){

        const tegenstander =
          norm(w.thuisploeg) === norm(RNB)
            ? w.uitploeg
            : w.thuisploeg;

        // Zoek eerst via de teamnaam die in wedstrijden staat.
        // Hierdoor zijn spaties/hoofdletters geen probleem.
        const tegenScore = scoreRows.find(s =>
          s.speeldatum === scoreDatum &&
          norm(s.teamNaam) === norm(tegenstander)
        );

        if(!tegenScore) continue;
        if(!Number.isFinite(tegenScore.kegelsNum)) continue;

        const sleutel =
          `${scoreDatum}|${norm(tegenstander)}|${tegenScore.kegelsNum}`;

        if(unieke.has(sleutel)) continue;
        unieke.add(sleutel);

        resultaten.push({
          tegenstander: tegenScore.teamNaam,
          kegels: tegenScore.kegelsNum,
          rnbKegels: rnbScore.kegelsNum,
          punten: tegenScore.puntenNum,
          datum: scoreDatum
        });
      }
    }

    // Zoek eerst de bestaande PDF-bestanden op basis van hun werkelijke bestandsnamen.
    await laadScorebladen();

    // Rangschikking 1: hoogste score van tegenstanders waarmee RNB
    // daadwerkelijk gespeeld heeft.
    resultaten.sort((a,b) => b.kegels - a.kegels);
    const top3TegenstandersRNB = resultaten.slice(0,3);

    // Rangschikking 2: hoogste individuele score van ALLE ploegen.
    // Deze ploegen hoefden dus niet tegen RNB gespeeld te hebben.
    const alleScores = scoreRows
      .filter(s => Number.isFinite(s.kegelsNum))
      .map(s => {
        const wedstrijd = (wedstrijden || []).find(w =>
          (w.werkelijke_datum || w.geplande_datum) === s.speeldatum &&
          (norm(w.thuisploeg) === norm(s.teamNaam) || norm(w.uitploeg) === norm(s.teamNaam))
        );
        const tegenploeg = wedstrijd
          ? (norm(wedstrijd.thuisploeg) === norm(s.teamNaam) ? wedstrijd.uitploeg : wedstrijd.thuisploeg)
          : "";
        return {
          ploeg: s.teamNaam,
          kegels: s.kegelsNum,
          punten: s.puntenNum,
          datum: s.speeldatum,
          ploeg1: s.teamNaam,
          ploeg2: tegenploeg
        };
      })
      .sort((a,b) => b.kegels - a.kegels);

    const top3AllePloegen = alleScores.slice(0,3);

    status.textContent =
      `RNB-tegenstanders: ${resultaten.length} wedstrijden gevonden.`;

    const maakKaarten = (items) => {
      if(!items.length){
        return `<div class="kaart"><strong>Geen resultaten gevonden.</strong></div>`;
      }

      return items.map((r,i) => `
        <div class="kaart">
          <div class="rang">${i+1}</div>
          <div class="gegevens">
            <div class="tegenstander">${r.tegenstander || r.ploeg}</div>
            <div class="details">
              <strong>${r.kegels} kegels</strong>
              &nbsp; • &nbsp;
              ${r.rnbKegels != null ? `RNB: ${r.rnbKegels} kegels &nbsp; • &nbsp; Verschil: ${r.kegels - r.rnbKegels} kegels &nbsp; • &nbsp;` : ""}
              ${r.punten} punten
              &nbsp; • &nbsp;
              ${formatDatum(r.datum)}
            </div>
            <button type="button" class="scoreblad-link" onclick="openScoreblad('${String(r.datum || "").slice(0,10)}', '${String(r.ploeg1 || "RNB Geenens Construct").replace(/\\'/g, "\\\\'")}', '${String(r.ploeg2 || r.tegenstander || r.ploeg || "").replace(/\\'/g, "\\\\'")}', this)">📄 Scoreblad openen</button>
          </div>
        </div>
      `).join("");
    };

    const rnbTitel = document.createElement("h2");
    rnbTitel.textContent = '🎳 Top 3 tegen ons gespeeld';
    lijst.innerHTML = maakKaarten(top3TegenstandersRNB);

    const alleTitel = document.createElement("h2");
    alleTitel.textContent = "🏆 Top 3 van alle ploegen";

    const alleBlok = document.createElement("div");
    alleBlok.innerHTML = maakKaarten(top3AllePloegen);

    lijst.prepend(rnbTitel);
    lijst.appendChild(alleTitel);
    lijst.appendChild(alleBlok);

    status.textContent =
      `Gevonden wedstrijden: ${resultaten.length} — gesorteerd op kegels van de tegenstander.`;

  }catch(error){

    console.error(error);

    status.textContent = "Fout bij het laden.";

    lijst.innerHTML = `
      <div class="kaart fout">
        <strong>Fout bij het laden van de gegevens.</strong>
        <p>${error.message || error}</p>
      </div>`;
  }
}

laadData();
</script>

<script>
(function () {
    const THEME_KEY = "rollbowl-thema";

    function updateThemeButton() {
        const button = document.getElementById("themeToggleRB");
        if (!button) return;

        const dark = document.body.classList.contains("rb-dark");
        button.textContent = dark ? "☀️ Licht" : "🌙 Donker";
        button.setAttribute("aria-label",
            dark ? "Schakel naar lichte modus" : "Schakel naar donkere modus");
        button.title = dark ? "Lichte modus" : "Donkere modus";
    }

    function applyTheme() {
        const dark = localStorage.getItem(THEME_KEY) === "donker";
        document.body.classList.toggle("rb-dark", dark);
        updateThemeButton();
    }

    window.wisselRollbowlThema = function () {
        const dark = !document.body.classList.contains("rb-dark");
        document.body.classList.toggle("rb-dark", dark);
        localStorage.setItem(THEME_KEY, dark ? "donker" : "licht");
        updateThemeButton();
    };

    function initTheme() {
        if (!document.getElementById("themeToggleRB")) {
            const button = document.createElement("button");
            button.id = "themeToggleRB";
            button.className = "theme-toggle-rb";
            button.type = "button";
            button.addEventListener("click", window.wisselRollbowlThema);
            document.body.appendChild(button);
        }
        applyTheme();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initTheme);
    } else {
        initTheme();
    }
})();
</script>

</body>
